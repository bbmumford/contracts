version: v2
deps:
  - buf.build/googleapis/googleapis
lint:
  use:
    - STANDARD
  except:
    - FIELD_LOWER_SNAKE_CASE
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
    - ENUM_VALUE_PREFIX
    - IMPORT_USED
    - PACKAGE_SAME_DIRECTORY
    - DIRECTORY_SAME_PACKAGE
breaking:
  use:
    - FILE
modules:
  - path: protobuf
    name: buf.build/bbmumford/contracts
