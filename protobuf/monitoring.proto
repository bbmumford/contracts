syntax = "proto3";

package hstles.monitoring;

import "google/api/annotations.proto";
import "hstles/options.proto";

option go_package = "github.com/bbmumford/contracts/monitoring/protobuf;protobuf";

// MonitoringService provides status monitoring operations for the HSTLES platform.
// Tracks endpoint health, maintenance windows, incidents, and mesh topology.
service MonitoringService {
  // ========== Public Endpoints ==========

  // Get overall platform status (operational, degraded, outage)
  rpc GetOverallStatus(GetOverallStatusRequest) returns (GetOverallStatusResponse) {
    option (google.api.http) = {
      get: "/api/monitoring/status"
    };
    option (hstles.tenant_scope) = TENANT_SCOPE_NONE;
  }

  // Get all monitored services with their current status
  rpc GetServices(GetServicesRequest) returns (GetServicesResponse) {
    option (google.api.http) = {
      get: "/api/monitoring/services"
    };
    option (hstles.tenant_scope) = TENANT_SCOPE_NONE;
  }

  // Get detailed status for a specific service
  rpc GetServiceStatus(GetServiceStatusRequest) returns (GetServiceStatusResponse) {
    option (google.api.http) = {
      get: "/api/monitoring/services/{slug}"
    };
    option (hstles.tenant_scope) = TENANT_SCOPE_NONE;
  }

  // Get all active and scheduled maintenance windows
  rpc GetMaintenanceWindows(GetMaintenanceWindowsRequest) returns (GetMaintenanceWindowsResponse) {
    option (google.api.http) = {
      get: "/api/monitoring/maintenance"
    };
    option (hstles.tenant_scope) = TENANT_SCOPE_NONE;
  }

  // Get recent and ongoing incidents
  rpc GetIncidents(GetIncidentsRequest) returns (GetIncidentsResponse) {
    option (google.api.http) = {
      get: "/api/monitoring/incidents"
    };
    option (hstles.tenant_scope) = TENANT_SCOPE_NONE;
  }

  // Get uptime metrics for endpoints
  rpc GetUptimeMetrics(GetUptimeMetricsRequest) returns (GetUptimeMetricsResponse) {
    option (google.api.http) = {
      get: "/api/monitoring/uptime"
    };
    option (hstles.tenant_scope) = TENANT_SCOPE_NONE;
  }

  // ========== Protected Endpoints (Mesh Topology) ==========

  // Get mesh node information from LAD gossip
  rpc GetNodes(GetNodesRequest) returns (GetNodesResponse) {
    option (google.api.http) = {
      get: "/api/monitoring/nodes"
    };
    option (hstles.tenant_scope) = TENANT_SCOPE_TENANT;
  }

  // Get detailed information about a specific mesh node
  rpc GetNodeDetails(GetNodeDetailsRequest) returns (GetNodeDetailsResponse) {
    option (google.api.http) = {
      get: "/api/monitoring/nodes/{node_id}"
    };
    option (hstles.tenant_scope) = TENANT_SCOPE_TENANT;
  }

  // ========== Service Endpoints (Admin Operations) ==========

  // Register a new maintenance window
  rpc RegisterMaintenanceWindow(RegisterMaintenanceWindowRequest) returns (RegisterMaintenanceWindowResponse) {
    option (google.api.http) = {
      post: "/api/monitoring/maintenance"
      body: "*"
    };
    option (hstles.tenant_scope) = TENANT_SCOPE_PLATFORM;
  }

  // Update an existing maintenance window
  rpc UpdateMaintenanceWindow(UpdateMaintenanceWindowRequest) returns (UpdateMaintenanceWindowResponse) {
    option (google.api.http) = {
      put: "/api/monitoring/maintenance/{id}"
      body: "*"
    };
    option (hstles.tenant_scope) = TENANT_SCOPE_PLATFORM;
  }

  // Manually check an endpoint's health
  rpc CheckEndpoint(CheckEndpointRequest) returns (CheckEndpointResponse) {
    option (google.api.http) = {
      post: "/api/monitoring/check"
      body: "*"
    };
    option (hstles.tenant_scope) = TENANT_SCOPE_NONE;
  }

  // Record a status change event (used by health checker)
  rpc RecordStatusChange(RecordStatusChangeRequest) returns (RecordStatusChangeResponse) {
    option (google.api.http) = {
      post: "/api/monitoring/events"
      body: "*"
    };
    option (hstles.tenant_scope) = TENANT_SCOPE_PLATFORM;
  }
}

// ========== Enums ==========

// ServiceStatus represents the current health status of a service or endpoint
enum ServiceStatus {
  SERVICE_STATUS_UNSPECIFIED = 0;
  SERVICE_STATUS_OPERATIONAL = 1;     // All systems working normally
  SERVICE_STATUS_DEGRADED = 2;        // Reduced performance or partial functionality
  SERVICE_STATUS_PARTIAL_OUTAGE = 3;  // Some components affected
  SERVICE_STATUS_MAJOR_OUTAGE = 4;    // Service unavailable
  SERVICE_STATUS_MAINTENANCE = 5;     // Scheduled maintenance in progress
}

// EndpointType represents the type of endpoint being monitored
enum EndpointType {
  ENDPOINT_TYPE_UNSPECIFIED = 0;
  ENDPOINT_TYPE_HTTP = 1;      // HTTP/HTTPS health check
  ENDPOINT_TYPE_GRPC = 2;      // gRPC health check
  ENDPOINT_TYPE_MESH_RPC = 3;  // VL1 mesh RPC check
  ENDPOINT_TYPE_TCP = 4;       // TCP connection check
}

// IncidentStatus represents the current status of an incident
enum IncidentStatus {
  INCIDENT_STATUS_UNSPECIFIED = 0;
  INCIDENT_STATUS_INVESTIGATING = 1;  // Issue identified, investigating cause
  INCIDENT_STATUS_IDENTIFIED = 2;     // Root cause identified, working on fix
  INCIDENT_STATUS_MONITORING = 3;     // Fix applied, monitoring for stability
  INCIDENT_STATUS_RESOLVED = 4;       // Issue resolved
}

// MaintenanceStatus represents the status of a maintenance window
enum MaintenanceStatus {
  MAINTENANCE_STATUS_UNSPECIFIED = 0;
  MAINTENANCE_STATUS_SCHEDULED = 1;   // Upcoming maintenance
  MAINTENANCE_STATUS_IN_PROGRESS = 2; // Currently underway
  MAINTENANCE_STATUS_COMPLETED = 3;   // Successfully completed
  MAINTENANCE_STATUS_CANCELLED = 4;   // Cancelled before completion
}

// ========== Common Messages ==========

// Service represents a logical grouping of endpoints
message Service {
  string slug = 1;           // Unique identifier (e.g., "auth", "identity")
  string name = 2;           // Display name (e.g., "Authentication")
  string description = 3;    // Brief description
  ServiceStatus status = 4;  // Current status
  int32 display_order = 5;   // Sort order for display
  repeated Endpoint endpoints = 6;  // Endpoints in this service
}

// Endpoint represents a specific monitored endpoint
message Endpoint {
  string slug = 1;              // Unique identifier
  string name = 2;              // Display name
  string url = 3;               // URL being monitored
  EndpointType type = 4;        // Type of check
  string service_slug = 5;      // Parent service
  ServiceStatus status = 6;     // Current status
  int32 interval_seconds = 7;   // Check interval
  int32 timeout_ms = 8;         // Timeout for checks
  bool enabled = 9;             // Whether monitoring is enabled
  int64 last_check_at = 10;     // Unix timestamp of last check
  int32 last_response_time_ms = 11;  // Response time of last check
}

// MaintenanceWindow represents a scheduled or active maintenance period
message MaintenanceWindow {
  string id = 1;                 // Unique identifier
  string title = 2;              // Brief title
  string description = 3;        // Detailed description
  repeated string affected_services = 4;  // Service slugs affected
  int64 start_at = 5;            // Unix timestamp
  int64 end_at = 6;              // Unix timestamp
  MaintenanceStatus status = 7;  // Current status
  int64 created_at = 8;          // Unix timestamp
}

// Incident represents a service incident
message Incident {
  string id = 1;                 // Unique identifier
  string title = 2;              // Brief title
  IncidentStatus status = 3;     // Current status
  ServiceStatus impact = 4;      // Severity impact
  repeated string affected_services = 5;  // Service slugs affected
  int64 started_at = 6;          // Unix timestamp
  int64 resolved_at = 7;         // Unix timestamp (0 if ongoing)
  repeated IncidentUpdate updates = 8;  // Status updates
}

// IncidentUpdate represents a status update for an incident
message IncidentUpdate {
  string id = 1;
  IncidentStatus status = 2;
  string message = 3;
  int64 created_at = 4;  // Unix timestamp
}

// UptimeMetric represents daily uptime metrics for an endpoint
message UptimeMetric {
  string endpoint_slug = 1;
  string date = 2;               // YYYY-MM-DD format
  double uptime_percent = 3;     // 0-100
  int32 total_checks = 4;
  int32 successful_checks = 5;
  int32 avg_response_time_ms = 6;
}

// NodeInfo represents information about a mesh node
message NodeInfo {
  string node_id = 1;           // VL1 node ID
  repeated string roles = 2;    // Roles this node provides (e.g., "auth", "notify")
  string region = 3;            // Geographic region
  repeated string handlers = 4; // RPC handlers available
  int64 last_seen_at = 5;       // Unix timestamp
  bool reachable = 6;           // Whether node is currently reachable
}

// ========== Request/Response Messages ==========

// GetOverallStatus
message GetOverallStatusRequest {}

message GetOverallStatusResponse {
  ServiceStatus status = 1;              // Overall platform status
  int32 services_operational = 2;        // Count of operational services
  int32 services_degraded = 3;           // Count of degraded services
  int32 services_outage = 4;             // Count of services with outage
  int32 active_incidents = 5;            // Count of active incidents
  int32 active_maintenance = 6;          // Count of active maintenance windows
  repeated Incident ongoing_incidents = 7;  // Active incidents
}

// GetServices
message GetServicesRequest {}

message GetServicesResponse {
  repeated Service services = 1;
}

// GetServiceStatus
message GetServiceStatusRequest {
  string slug = 1;
}

message GetServiceStatusResponse {
  Service service = 1;
  repeated UptimeMetric uptime_history = 2;  // Last 90 days
}

// GetMaintenanceWindows
message GetMaintenanceWindowsRequest {
  bool include_completed = 1;  // Include completed maintenance windows
  int32 days = 2;              // Number of days to look back (default: 30)
}

message GetMaintenanceWindowsResponse {
  repeated MaintenanceWindow windows = 1;
}

// GetIncidents
message GetIncidentsRequest {
  bool include_resolved = 1;  // Include resolved incidents
  int32 days = 2;             // Number of days to look back (default: 30)
}

message GetIncidentsResponse {
  repeated Incident incidents = 1;
}

// GetUptimeMetrics
message GetUptimeMetricsRequest {
  string endpoint_slug = 1;  // Optional: filter by endpoint
  string service_slug = 2;   // Optional: filter by service
  int32 days = 3;            // Number of days (default: 90)
}

message GetUptimeMetricsResponse {
  repeated UptimeMetric metrics = 1;
  double overall_uptime_percent = 2;  // Aggregated uptime
}

// GetNodes
message GetNodesRequest {
  string role = 1;    // Optional: filter by role
  string region = 2;  // Optional: filter by region
}

message GetNodesResponse {
  repeated NodeInfo nodes = 1;
  int32 total_nodes = 2;
  map<string, int32> nodes_by_role = 3;    // Role -> count
  map<string, int32> nodes_by_region = 4;  // Region -> count
}

// GetNodeDetails
message GetNodeDetailsRequest {
  string node_id = 1;
}

message GetNodeDetailsResponse {
  NodeInfo node = 1;
  repeated string peers = 2;     // Connected peer node IDs
  int64 uptime_seconds = 3;      // Node uptime
  map<string, int64> rpc_counts = 4;  // Handler -> call count
}

// RegisterMaintenanceWindow
message RegisterMaintenanceWindowRequest {
  string title = 1;
  string description = 2;
  repeated string affected_services = 3;
  int64 start_at = 4;
  int64 end_at = 5;
}

message RegisterMaintenanceWindowResponse {
  MaintenanceWindow window = 1;
}

// UpdateMaintenanceWindow
message UpdateMaintenanceWindowRequest {
  string id = 1;
  string title = 2;
  string description = 3;
  repeated string affected_services = 4;
  int64 start_at = 5;
  int64 end_at = 6;
  MaintenanceStatus status = 7;
}

message UpdateMaintenanceWindowResponse {
  MaintenanceWindow window = 1;
}

// CheckEndpoint
message CheckEndpointRequest {
  string endpoint_slug = 1;  // Endpoint to check
}

message CheckEndpointResponse {
  string endpoint_slug = 1;
  ServiceStatus status = 2;
  int32 response_time_ms = 3;
  int32 status_code = 4;
  string error_message = 5;
  int64 checked_at = 6;
}

// RecordStatusChange
message RecordStatusChangeRequest {
  string endpoint_slug = 1;
  ServiceStatus old_status = 2;
  ServiceStatus new_status = 3;
  string reason = 4;
}

message RecordStatusChangeResponse {
  bool success = 1;
  string incident_id = 2;  // If an incident was created
}
