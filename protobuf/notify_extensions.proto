syntax = "proto3";

package hstles.notify;

option go_package = "github.com/bbmumford/contracts/notify/protobuf;protobuf";

// Notify extension messages — user-event fan-out RPCs that the core
// NotifyService proto did not originally expose. Authored in a separate file
// so the canonical notify.pb.go descriptor numbering stays untouched and
// new RPCs can land without re-flowing the generated file.

// PublishUserEvent fans a user-facing domain event (e.g. "tenant.provisioned",
// "billing_profile.activated", "payment.failed") out to the channels enabled
// for that user under the event's category — typically email + in-app +
// webhook. The (user_id, idempotency_key) pair is the dedup anchor: a retry
// with the same pair replays the original delivery outcome without re-fanning.
//
// Distinct from SendNotification:
//   - SendNotification is a UI-facing send that always produces an in-app
//     row and optionally fans to email / push as a toast-style delivery.
//   - PublishUserEvent is the domain-event variant — designed to be called
//     by other Quorum / HSTLES services on state transitions, with built-in
//     idempotency so an at-least-once caller cannot double-deliver.
//
// The event is recorded in notification_user_events first; channel fan-out
// happens after the dedup row is locked, so a crash-then-retry resumes from
// the dedup row rather than re-running fan-out.
message PublishUserEventRequest {
  // Recipient user_id within the active tenant scope. Required.
  string user_id = 1;
  // Dotted event identifier (e.g. "tenant.provisioned", "payment.failed").
  // Used as the notification category for preference lookup. Required.
  string event_type = 2;
  // Event-specific small key/value bag. Surfaces to in-app notification
  // metadata, email template variables, and webhook payload body.
  // Bounded by the same 50-key / 500-char-value limits as Stripe metadata
  // (no enforcement here — emitters self-bound).
  map<string, string> payload = 3;
  // Originating domain (e.g. "quorum.billing_profile", "hstles.identity").
  // Surfaces to clients as source_service for filter routing; persisted on
  // the dedup row so audit traces can see which subsystem emitted it.
  string source_domain = 4;
  // Emitter-side dedup token. When non-empty, the (user_id, idempotency_key)
  // pair must be unique — a duplicate is a successful no-op replay. When
  // empty, no dedup is performed and each call fans out independently.
  string idempotency_key = 5;
  // Optional human-readable title — when omitted, the handler synthesises
  // one from event_type ("billing_profile.activated" -> "Billing profile
  // activated"). Surfaces to in-app + email + push subject lines.
  string title = 6;
  // Optional human-readable body — when omitted, in-app delivery uses the
  // title alone and email / push use the title as the body too.
  string body = 7;
  // Optional deep-link URL for click-to-navigate on in-app + push.
  string action_url = 8;
}

message PublishUserEventResponse {
  // True when at least one transport accepted the event (in-app row
  // persisted, push token reached, webhook URL accepted). Also true for
  // idempotent replays of a previously-delivered event.
  bool delivered = 1;
  // Count of transports the event reached. Zero when delivered == false
  // (no preferences enabled OR all channels failed). Mirrors the channel
  // count, not per-device fan-out.
  int32 subscriber_count = 2;
  // True when the (user_id, idempotency_key) pair was already recorded;
  // the handler short-circuits and returns the cached outcome. Always
  // false when idempotency_key is empty.
  bool already_published = 3;
  // Server-generated event id; persisted in notification_user_events as
  // the primary key. Empty for replay responses where the original event
  // id is not surfaced (callers consult already_published).
  string event_id = 4;
  // Populated on failure; empty on success or idempotent replay.
  string error = 5;
}
