syntax = "proto3";

package contracts.subject.v1;

option go_package = "github.com/bbmumford/contracts/subject/protobuf;protobuf";

// Requests and responses of orbtr.subject, the feature holding one document per
// subject in the control database and one settings row per subject in each
// partition database. Every operation reads the subject, and the partition where
// one applies, from the proved caller: no message here names either, so no caller
// can ask about anyone but itself.

// SubjectDocument is a subject's profile and preferences.
message SubjectDocument {
  // display_name is the name the subject goes by. A subject that has set none
  // answers the name its identity provider gave at founding.
  string display_name = 1;
  // email is the subject's contact address. A subject that has set none answers
  // the address its identity provider gave at founding. Writing it changes no
  // sign-in address: those are identity edges of the membership graph.
  string email = 2;
  // preferences are the subject's own key/value settings.
  map<string, string> preferences = 3;
  // created_at_unix is when the document was first written, 0 for a subject that
  // has written none.
  int64 created_at_unix = 4;
}

message GetDocumentRequest {}

message GetDocumentResponse {
  SubjectDocument document = 1;
}

// UpdateDocumentRequest changes what it carries and keeps the rest.
message UpdateDocumentRequest {
  optional string display_name = 1;
  optional string email = 2;
  // preferences are merged over the stored ones; a key with an empty value is
  // removed.
  map<string, string> preferences = 3;
}

message UpdateDocumentResponse {
  SubjectDocument document = 1;
}

message GetMemberSettingsRequest {}

message GetMemberSettingsResponse {
  // settings are the caller's key/value settings within the caller's partition.
  map<string, string> settings = 1;
}

// UpdateMemberSettingsRequest merges settings over the stored ones; a key with an
// empty value is removed.
message UpdateMemberSettingsRequest {
  map<string, string> settings = 1;
}

message UpdateMemberSettingsResponse {
  map<string, string> settings = 1;
}
