syntax = "proto3";

package contracts.auth.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "contracts/options/v1/options.proto";

option go_package = "github.com/bbmumford/contracts/auth/protobuf;protobuf";

// AuthService provides auth operations over gRPC and HTTP
service AuthService {
  // ========== Session Management ==========

  // Full session validation with user details
  rpc ValidateSession(ValidateSessionRequest) returns (ValidateSessionResponse) {
    option (google.api.http) = {
      get: "/api/session"
    };
  }

  // Delete a specific session
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse) {
    option (google.api.http) = {
      delete: "/api/session"
    };
  }

  // Lightweight session probe for health checks
  rpc ValidateSessionHead(ValidateSessionHeadRequest) returns (ValidateSessionHeadResponse) {
    option (google.api.http) = {
      custom: {
        kind: "HEAD"
        path: "/api/session"
      }
    };
  }

  // List all active user sessions
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option (google.api.http) = {
      get: "/api/sessions"
    };
  }

  // Delete all user sessions (logout from all devices)
  rpc DeleteAllSessions(DeleteAllSessionsRequest) returns (DeleteAllSessionsResponse) {
    option (google.api.http) = {
      delete: "/api/sessions"
    };
    option (contracts.options.v1.rateLimit) = RATE_LIMIT_STRICT;
  }

  // Resolve one session id to the live session it names: its id, subject,
  // partition and deadline. The asker is an endpoint proving a request that
  // carries the id and holding no session store of its own, so it reads,
  // through this operation, the store of the endpoint that mints sessions.
  // Its reader is a sessioncred.Store whose Get dials this operation each time
  // it is asked for a session and keeps no answer, installed by each endpoint
  // that proves a request this way.
  //
  // Mesh only, with no HTTP binding: the request names any session, so the
  // answer is for a control-plane service proving a request and never for the
  // session's subject. The missing binding does not keep a caller out:
  // rpchttp.RegisterAll mounts POST /rpc/<fqn> for every handler in the
  // registry it is given, and rpchttp.Bridge.HandleRPC serves every handler of
  // its registry at POST /rpc/{handler}. What confines this operation is the
  // scope its declaration admits, so that declaration must admit only a
  // control-plane service holding the session-resolve capability.
  rpc ResolveSession(ResolveSessionRequest) returns (ResolveSessionResponse) {
  }

  // Spend a single-use id on the authentication host's spent list, in a key
  // namespace the asker names, until an expiry, and answer whether this call
  // was the first to spend it there. The asker is an endpoint whose instances
  // share one replay ledger of the request proofs they verify and which holds
  // no spent list of its own: every instance spends through this operation
  // under the endpoint's host name, so an id one instance spent is refused at
  // every other, while two endpoints' namespaces never meet, so a proof one
  // endpoint verified and forwarded is spent once more, not refused, at the
  // next. The asker's reader is a requestproof.SpentIDLedger over a
  // sessioncred/rpcstore SpentIDs.
  //
  // Mesh only, with no HTTP binding: the request names any namespace, so what
  // confines this operation is the scope its declaration admits, a
  // control-plane service holding the spent-id capability.
  rpc SpendID(SpendIDRequest) returns (SpendIDResponse) {
  }

  // Describe the signed-in caller: who it is, the partition and session it acts
  // under and until when, its name and address, the partition's name, the
  // capabilities it holds now and the plan features its plan includes. The
  // request names nothing; every answer is the proved caller's own, so it is for
  // a client learning who it signed in as.
  rpc DescribeCaller(DescribeCallerRequest) returns (DescribeCallerResponse) {
  }

  // Process an emailed login code into a session: verify the code, resolve the
  // subject's partition, mint a session into the processing endpoint's own
  // store and sign a token pair bound to it. The asker is a login surface that
  // took the code from a browser and holds no session store; it sets the
  // returned session id as its cookie and hands the tokens on.
  //
  // Mesh only, with no HTTP binding, for the reason ResolveSession has none:
  // what confines it is the scope its declaration admits, which must admit
  // only a control-plane service holding the login-processing capability.
  rpc LoginWithEmailCode(LoginWithEmailCodeRequest) returns (LoginWithEmailCodeResponse) {
  }

  // Issue an emailed login code: find the existing account the address
  // belongs to, record a single-use code for it and send the code to the
  // address. The asker is a login surface passing on the address a browser
  // entered. An address with no account answers as one with an account, and
  // nothing is sent, so the answer does not say which addresses hold one.
  //
  // Mesh only, with no HTTP binding, under the login-processing capability,
  // for the reason LoginWithEmailCode has none.
  rpc IssueEmailLoginCode(IssueEmailLoginCodeRequest) returns (IssueEmailLoginCodeResponse) {
  }

  // Start a provider login: answer the provider's authorization URL, carrying
  // a state the processing endpoint signed. The provider returns the browser
  // to the login surface's callback, which passes the code and state to
  // CompleteProviderLogin.
  //
  // Mesh only, with no HTTP binding, under the login-processing capability.
  rpc StartProviderLogin(StartProviderLoginRequest) returns (StartProviderLoginResponse) {
  }

  // Complete a provider login: verify the signed state, exchange the code
  // with the provider, find the subject the provider identity belongs to,
  // mint a session into the processing endpoint's own store and sign a token
  // pair bound to it. A provider identity no subject holds mints nothing and
  // founds nothing: the answer says sign-up is required, and the login surface
  // sends the browser to its sign-up page, which founds the partition.
  //
  // Mesh only, with no HTTP binding, under the login-processing capability.
  rpc CompleteProviderLogin(CompleteProviderLoginRequest) returns (CompleteProviderLoginResponse) {
  }

  // Sign up: verify a signed sign-up token the processing endpoint answered a
  // first-time login with, then, in one transaction, create the subject the
  // token names, its identity link, a partition on the free plan and the
  // subject's admin seat in it, and mint a session into that partition. The
  // asker is a login surface passing on the token its sign-up page took; the
  // token is the proof of the identity, so no subject calls it.
  //
  // Mesh only, with no HTTP binding, under the login-processing capability.
  rpc SignUp(SignUpRequest) returns (SignUpResponse) {
  }

  // Redeem a login handoff: verify a signed handoff token the processing
  // endpoint issued to hand a person's session to another origin, record the
  // token's id as spent, read the session it names again, and mint a session
  // for the same subject and partition into the processing endpoint's own
  // store, with a token pair whose audience is the receiving origin. The asker
  // is the receiving origin's surface, passing on the token the browser
  // arrived with and its own configured origin; it sets the returned session
  // id as its cookie.
  //
  // Mesh only, with no HTTP binding, under the login-processing capability.
  rpc RedeemHandoff(RedeemHandoffRequest) returns (RedeemHandoffResponse) {
  }

  // Exchange a native sign-in code: verify the one-time code a login that
  // returned to a native app answered, require the return and the PKCE
  // verifier it was issued for, record it as spent, mint a session into the
  // processing endpoint's own store and sign a token pair bound to it, whose
  // audience is the device the login was started for, or the return's client
  // id when it named none. The asker is a login surface passing on what a
  // native app posted to its exchange route.
  //
  // Mesh only, with no HTTP binding, under the login-processing capability.
  rpc ExchangeNativeCode(ExchangeNativeCodeRequest) returns (ExchangeNativeCodeResponse) {
  }

  // Refresh a token pair: verify the refresh token the processing endpoint
  // signed, require it to be a refresh token for the client it names, read the
  // partition's access policy for its provider and the client address, rotate
  // the session it is bound to so it cannot be presented again, and sign a fresh
  // pair bound to the rotated session. The asker is a login surface passing on
  // what a client posted to its refresh route.
  //
  // Mesh only, with no HTTP binding, under the login-processing capability.
  rpc RefreshTokenPair(RefreshTokenPairRequest) returns (RefreshTokenPairResponse) {
  }

  // Read the public keys the processing endpoint's tokens verify under: the
  // current key version and, until its grace ends, the previous one. The asker
  // is a login surface serving them as a JSON Web Key Set to clients that verify
  // the tokens themselves.
  //
  // Mesh only, with no HTTP binding, under the login-processing capability.
  rpc GetTokenKeys(GetTokenKeysRequest) returns (GetTokenKeysResponse) {
  }

  // Read whether the caller's partition requires a second factor of every
  // login into it: the second-factor policy feature's row in the partition's
  // own database. The partition is the sealed caller's.
  rpc GetSecondFactorPolicy(GetSecondFactorPolicyRequest) returns (GetSecondFactorPolicyResponse) {
  }

  // Set whether the caller's partition requires a second factor of every
  // login into it. The partition is the sealed caller's.
  rpc SetSecondFactorPolicy(SetSecondFactorPolicyRequest) returns (SetSecondFactorPolicyResponse) {
  }

  // VerifySecondFactor redeems the second-factor token a login that stopped for a
  // second factor answered, with the code the person entered, into a session. It
  // is reached over the mesh by a login surface holding the login-processing
  // capability, like the login it finishes.
  rpc VerifySecondFactor(VerifySecondFactorRequest) returns (VerifySecondFactorResponse) {
  }

  // ChoosePartition redeems the partition-choice token a login that stopped for
  // a partition choice answered, with the partition the person chose, into a
  // session, or into a second-factor stop when that partition requires one. It is
  // reached over the mesh by a login surface holding the login-processing
  // capability, like the login it finishes.
  rpc ChoosePartition(ChoosePartitionRequest) returns (ChoosePartitionResponse) {
  }

  // BeginSecondFactorEnrolment answers the secret a person enrols in their
  // authenticator, for the enrolment token a login answered when the partition
  // requires a second factor of a subject with none.
  rpc BeginSecondFactorEnrolment(BeginSecondFactorEnrolmentRequest) returns (BeginSecondFactorEnrolmentResponse) {
  }

  // ConfirmSecondFactorEnrolment stores the factor once its code proves the
  // authenticator holds the secret, and mints the login that stopped for it.
  rpc ConfirmSecondFactorEnrolment(ConfirmSecondFactorEnrolmentRequest) returns (ConfirmSecondFactorEnrolmentResponse) {
  }

  // SwitchPartition ends the caller's session and mints a new one in the partition
  // named, after checking the session's subject belongs there.
  rpc SwitchPartition(SwitchPartitionRequest) returns (SwitchPartitionResponse) {
  }

  // GetAccessPolicy reads the caller's partition's access policy.
  rpc GetAccessPolicy(GetAccessPolicyRequest) returns (GetAccessPolicyResponse) {
  }

  // SetAccessPolicy writes the caller's partition's access policy, which every
  // later login and handoff into the partition reads.
  rpc SetAccessPolicy(SetAccessPolicyRequest) returns (SetAccessPolicyResponse) {
  }

  // Switch active organization context
  rpc SwitchContext(SwitchContextRequest) returns (SwitchContextResponse) {
    option (google.api.http) = {
      post: "/api/auth/switch-context"
      body: "*"
    };
  }

  // ========== 2FA Management ==========

  // Enable 2FA for authenticated user
  rpc Configure2FA(Configure2FARequest) returns (Configure2FAResponse) {
    option (google.api.http) = {
      post: "/api/2fa/configure"
      body: "*"
    };
    option (contracts.options.v1.rateLimit) = RATE_LIMIT_STRICT;
  }

  // Disable 2FA for authenticated user
  rpc Delete2FA(Delete2FARequest) returns (Delete2FAResponse) {
    option (google.api.http) = {
      delete: "/api/2fa"
    };
    option (contracts.options.v1.rateLimit) = RATE_LIMIT_STRICT;
  }

  // Reset/disable 2FA configuration
  rpc Reset2FA(Reset2FARequest) returns (Reset2FAResponse) {
    option (google.api.http) = {
      post: "/api/2fa/reset"
      body: "*"
    };
    option (contracts.options.v1.rateLimit) = RATE_LIMIT_STRICT;
  }

  // Get user's 2FA configuration status
  rpc Get2FAStatus(Get2FAStatusRequest) returns (Get2FAStatusResponse) {
    option (google.api.http) = {
      get: "/api/2fa/status"
    };
  }

  // Verify 2FA code during authentication
  rpc Verify2FA(Verify2FARequest) returns (Verify2FAResponse) {
    option (google.api.http) = {
      post: "/api/2fa/verify"
      body: "*"
    };
    option (contracts.options.v1.rateLimit) = RATE_LIMIT_STRICT;
  }

  // Check if device is trusted for 2FA bypass
  rpc CheckTrustedDevice(CheckTrustedDeviceRequest) returns (CheckTrustedDeviceResponse) {
    option (google.api.http) = {
      get: "/api/2fa/trusted-device"
    };
  }

  // Check pending 2FA session state
  rpc CheckPendingSession(CheckPendingSessionRequest) returns (CheckPendingSessionResponse) {
    option (google.api.http) = {
      get: "/api/2fa/pending"
    };
  }

  // ========== 2FA Lockout (Service-to-Service) ==========

  // Lock out user after failed 2FA attempts
  rpc LockoutUser(LockoutUserRequest) returns (LockoutUserResponse) {
    option (google.api.http) = {
      post: "/api/2fa/lockout"
      body: "*"
    };
  }

  // Clear user lockout (admin/service operation)
  rpc ClearLockout(ClearLockoutRequest) returns (ClearLockoutResponse) {
    option (google.api.http) = {
      delete: "/api/2fa/lockout/{userID}"
    };
  }

  // Check user lockout status
  rpc GetLockoutStatus(GetLockoutStatusRequest) returns (GetLockoutStatusResponse) {
    option (google.api.http) = {
      get: "/api/2fa/lockout/{userID}"
    };
  }

  // ========== OAuth Authentication ==========

  // Initiate OAuth authentication flow
  rpc AuthFlow(AuthFlowRequest) returns (AuthFlowResponse) {
    option (google.api.http) = {
      get: "/auth"
    };
    option (contracts.options.v1.rateLimit) = RATE_LIMIT_OAUTH;
  }

  // Start OAuth authentication with provider
  rpc AuthStart(AuthStartRequest) returns (AuthStartResponse) {
    option (google.api.http) = {
      get: "/auth/{provider}"
    };
    option (contracts.options.v1.rateLimit) = RATE_LIMIT_OAUTH;
  }

  // ========== Cookie Session Mint ==========

  // Create a browser session row server-side and return its session key.
  // Used by thin gateways (app.orbtr.io, login.hstles.com, custom-app.com)
  // that have no platform-DB access and therefore cannot call the local
  // platform/session backend directly. The gateway holds the cookie
  // ceremony (Set-Cookie with the returned session_key) but the row
  // itself lives on the auth node next to the users it FKs into.
  rpc MintSession(MintSessionRequest) returns (MintSessionResponse) {
  }

  // ========== SSO Handoff ==========

  // Create SSO handoff token
  rpc Handover(HandoverRequest) returns (HandoverResponse) {
    option (google.api.http) = {
      post: "/api/handoff/create"
      body: "*"
    };
    option (contracts.options.v1.rateLimit) = RATE_LIMIT_HANDOFF;
  }

  // Verify and consume handoff token
  rpc VerifyHandoff(VerifyHandoffRequest) returns (VerifyHandoffResponse) {
    option (google.api.http) = {
      post: "/api/handoff/verify"
      body: "*"
    };
    option (contracts.options.v1.rateLimit) = RATE_LIMIT_HANDOFF;
  }

  // ========== Account Recovery ==========

  // Initiate account recovery (sends email)
  rpc InitiateRecovery(InitiateRecoveryRequest) returns (InitiateRecoveryResponse) {
    option (google.api.http) = {
      post: "/api/recovery/initiate"
      body: "*"
    };
    option (contracts.options.v1.rateLimit) = RATE_LIMIT_RECOVERY;
  }

  // Verify recovery code and return reset token
  rpc VerifyRecoveryCode(VerifyRecoveryCodeRequest) returns (VerifyRecoveryCodeResponse) {
    option (google.api.http) = {
      post: "/api/recovery/verify"
      body: "*"
    };
    option (contracts.options.v1.rateLimit) = RATE_LIMIT_RECOVERY;
  }

  // Generate new 2FA backup codes
  rpc GenerateBackupCodes(GenerateBackupCodesRequest) returns (GenerateBackupCodesResponse) {
    option (google.api.http) = {
      post: "/api/recovery/backup-codes"
      body: "*"
    };
  }

  // ========== Internal/Service RPCs (no HTTP exposure) ==========

  // Complete OAuth flow and return user data (Design 1)
  rpc CompleteOAuth(CompleteOAuthRequest) returns (CompleteOAuthResponse) {
  }

  // Exchange OAuth authorization code for user profile on the auth node.
  // Gateways call this instead of running gothic.CompleteUserAuth() locally,
  // because OAuth secrets and goth providers only exist on the auth node.
  // Supports per-gateway callback URLs: the auth node creates a transient
  // goth provider with the caller's redirect_uri so the token exchange
  // matches the authorization request.
  rpc ExchangeOAuthCode(ExchangeOAuthCodeRequest) returns (ExchangeOAuthCodeResponse) {
  }

  // Check if 2FA is required for this user/device (Design 1)
  rpc Check2FARequired(Check2FARequiredRequest) returns (Check2FARequiredResponse) {
  }

  // Create and send email magic link token
  rpc CreateEmailToken(CreateEmailTokenRequest) returns (CreateEmailTokenResponse) {
  }

  // Validate email magic link token
  rpc ValidateEmailToken(ValidateEmailTokenRequest) returns (ValidateEmailTokenResponse) {
  }

  // Delete (consume) email magic link token
  rpc DeleteEmailToken(DeleteEmailTokenRequest) returns (DeleteEmailTokenResponse) {
  }

  // Validate email login code (derived from token hash, zero additional storage)
  rpc ValidateEmailCode(ValidateEmailCodeRequest) returns (ValidateEmailCodeResponse) {
  }

  // Save OAuth provider linkage (tokens, provider user ID)
  rpc SaveUserProvider(SaveUserProviderRequest) returns (SaveUserProviderResponse) {
  }

  // List all linked SSO providers for the authenticated user
  rpc ListUserProviders(ListUserProvidersRequest) returns (ListUserProvidersResponse) {
    option (google.api.http) = {
      get: "/api/auth/providers"
    };
  }

  // Enable or disable a specific SSO provider for login
  rpc UpdateProviderStatus(UpdateProviderStatusRequest) returns (UpdateProviderStatusResponse) {
    option (google.api.http) = {
      put: "/api/auth/providers/{provider}"
      body: "*"
    };
  }

  // ========== JWT Token Management ==========

  // Issue new access + refresh token pair (after successful authentication)
  rpc IssueToken(IssueTokenRequest) returns (IssueTokenResponse) {
  }

  // Refresh access token using refresh token
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {
    option (google.api.http) = {
      post: "/api/auth/refresh"
      body: "*"
    };
    option (contracts.options.v1.rateLimit) = RATE_LIMIT_STRICT;
  }

  // Revoke token (logout for JWT-based clients)
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse) {
    option (google.api.http) = {
      post: "/api/auth/revoke"
      body: "*"
    };
  }

  // Introspect token (validate and get claims - for resource servers)
  rpc IntrospectToken(IntrospectTokenRequest) returns (IntrospectTokenResponse) {
    option (google.api.http) = {
      post: "/api/auth/introspect"
      body: "*"
    };
  }

  // Validate bearer token (for SecurityCore middleware)
  rpc ValidateBearerToken(ValidateBearerTokenRequest) returns (ValidateBearerTokenResponse) {
  }

  // Revoke all tokens for a user (logout from all devices)
  rpc RevokeAllUserTokens(RevokeAllUserTokensRequest) returns (RevokeAllUserTokensResponse) {
  }

  // VerifyState verifies an OAuth state token's HMAC signature, TTL, and origin
  // allowlist, and consumes the nonce (single-use replay protection). Gateways
  // call this RPC instead of verifying state locally so they never need to hold
  // the HMAC signing key. Centralising the nonce store on the auth node also
  // makes replay protection correct across horizontally-scaled gateway instances.
  rpc VerifyState(VerifyStateRequest) returns (VerifyStateResponse) {
  }

  // VerifyStateNoNonce does the same checks as VerifyState (signature, TTL,
  // origin) but does NOT mark the nonce as consumed. Use this for an early
  // "peek" at the payload before the nonce-consuming VerifyState. Exactly one
  // VerifyState call per OAuth callback must consume the nonce.
  rpc VerifyStateNoNonce(VerifyStateRequest) returns (VerifyStateResponse) {
  }
}

// ========== Request/Response Messages ==========

message AuthFlowRequest {
  string provider = 1; // OAuth provider (google, github, etc.)
  string next = 2; // Redirect destination after auth
}


message AuthFlowResponse {
  string authUrl = 1; // OAuth provider authorization URL
  string destination = 2; // Final destination after auth
  bool alreadyAuthed = 3; // User already authenticated
  string redirectUrl = 4; // Direct redirect if already authed
}


message AuthStartRequest {
  string provider = 1; // OAuth provider name
  string next = 2; // Redirect destination
  string clientOrigin = 3; // Originating client URL
  string deviceFingerprint = 4; // Device fingerprint for trusted device detection
  string appId = 5; // App ID for access control
  string partitionId = 6 [(contracts.options.v1.caller) = CALLER_PARTITION]; // Organization ID for access control
  string callbackBaseUrl = 7; // Base URL for OAuth callbacks (e.g. "https://app.orbtr.io")
}


message AuthStartResponse {
  string authUrl = 1; // Provider authorization URL
  string state = 2; // OAuth state parameter
  string redirectUrl = 3; // Callback redirect URL
}


message CheckPendingSessionRequest {
  string sessionId = 1 [(contracts.options.v1.caller) = CALLER_SESSION]; // Optional: if not provided, extract from context
}


message CheckPendingSessionResponse {
  bool valid = 1;
  string userId = 2;
  string provider = 3;
  string next = 4;
  int32 remainingSeconds = 5;
  string error = 6;
}


message CheckTrustedDeviceRequest {
  string deviceFingerprint = 1; // DeviceFingerprint is optional - if empty, will be extracted from context
  string sessionId = 2 [(contracts.options.v1.caller) = CALLER_SESSION]; // SessionID is optional - if empty, will use pending session from context
}


message CheckTrustedDeviceResponse {
  bool success = 1;
  bool isTrusted = 2;
  bool canBypass2fa = 3;
  string error = 4;
}


message ClearLockoutRequest {
  string userId = 1 [(contracts.options.v1.caller) = CALLER_SUBJECT];
}


message ClearLockoutResponse {
  bool success = 1;
  string error = 2;
}


message Configure2FARequest {
  string sessionId = 1 [(contracts.options.v1.caller) = CALLER_SESSION];  // Session ID for mesh RPC calls (required for server-to-server)
  string secret = 2;
  string code = 3;
  string backupCodes = 4;
}


message Configure2FAResponse {
  bool success = 1;
  string message = 2;
  string error = 3;
}


message Delete2FARequest {
  string sessionId = 1 [(contracts.options.v1.caller) = CALLER_SESSION]; // Session ID for mesh RPC calls (required for server-to-server)
}


message Delete2FAResponse {
  bool success = 1;
  string message = 2;
  string error = 3;
}


message DeleteAllSessionsRequest {
  string sessionId = 1 [(contracts.options.v1.caller) = CALLER_SESSION]; // Session ID for mesh RPC calls (required for server-to-server)
}


message DeleteAllSessionsResponse {
  bool success = 1;
  int32 deletedCount = 2;
  string error = 3;
}


message DeleteSessionRequest {
  string sessionId = 1 [(contracts.options.v1.caller) = CALLER_SESSION];        // Caller's session ID for authentication
  string targetSessionId = 2;  // Session ID to delete (must belong to same user)
}


message DeleteSessionResponse {
  bool success = 1;
  string error = 2;
}


message GenerateBackupCodesRequest {
  // No fields defined in Go struct
}


message GenerateBackupCodesResponse {
  bool success = 1;
  repeated string backupCodes = 2;
  string message = 3;
  string error = 4;
}


message Get2FAStatusRequest {
  string sessionId = 1 [(contracts.options.v1.caller) = CALLER_SESSION]; // Session ID for mesh RPC calls (required for server-to-server)
}


message Get2FAStatusResponse {
  bool enabled = 1;
  repeated string methods = 2;
  int32 backupCodesRemaining = 3;
  string error = 4;
}


message GetLockoutStatusRequest {
  string userId = 1 [(contracts.options.v1.caller) = CALLER_SUBJECT];
}


message GetLockoutStatusResponse {
  bool locked = 1;
  int32 remainingSeconds = 2;
  string error = 3;
}


message HandoverRequest {
  string userId = 1 [(contracts.options.v1.caller) = CALLER_SUBJECT]; // UserID is required - the user to handoff
  string destUrl = 2; // DestURL is the destination URL after handoff
  string audience = 3; // Audience is the target domain/audience
  string provider = 4; // Auth provider of the current session
  repeated string allowedProviders = 5; // Allowed providers for the current session
  string partitionId = 6 [(contracts.options.v1.caller) = CALLER_PARTITION]; // Active Organization ID to preserve context
}


message HandoverResponse {
  bool success = 1;
  string redirectUrl = 2;
  string handoffToken = 3;
  string error = 4;
}


message InitiateRecoveryRequest {
  string email = 1;
}


message InitiateRecoveryResponse {
  bool success = 1;
  string message = 2;
  string error = 3;
}


message ListSessionsRequest {
  string sessionId = 1 [(contracts.options.v1.caller) = CALLER_SESSION]; // Session ID for mesh RPC calls (required for server-to-server)
}


message ListSessionsResponse {
  repeated Session sessions = 1;
  string error = 2;
}


message LockoutUserRequest {
  string userId = 1 [(contracts.options.v1.caller) = CALLER_SUBJECT];
}


message LockoutUserResponse {
  int32 duration = 1; // seconds
  string error = 2;
}


message Reset2FARequest {
  string backupCode = 1;
  string password = 2;
}


message Reset2FAResponse {
  bool success = 1;
  string message = 2;
  string error = 3;
}


// ResolveSessionRequest names the session to resolve by what a request
// carried: session_id is a session cookie's value, the session's secret key;
// handle is the sid claim of a signed token, the session's public handle.
// Exactly one is set, and a request setting both or neither is a miss.
//
// It is a request field, never read from the proved caller, because the
// caller is the endpoint proving the request, not the session's subject.
message ResolveSessionRequest {
  string sessionId = 1 [(contracts.options.v1.caller) = CALLER_SESSION];
  string handle = 2;
}


// ResolveSessionResponse is the live session the id names.
//
// session_id is the record's public handle, read from the store and never the
// request's value echoed back; subject and partition are the record's. expires_at is the
// record's deadline, and unset when the record carries none, which is a
// session with no stored deadline and not one expiring at the zero instant.
//
// A miss answers with every field unset, never with some of them: an empty
// id, an id no session holds, a session whose deadline is at or before the
// present instant, a session deleted by a logout or a revocation, and a record
// missing its id, subject or partition.
//
// The server pulls its store level with the primary that every instance of
// the minting endpoint writes to, and then reads. A session minted, and a
// session deleted, through any instance is answered as such by whichever
// instance serves the request, on the condition that the write had reached
// that primary when the request arrived. A store that could not be pulled or
// read, and a live session held by a server given no pull, are each an RPC
// error, never a miss and never an answer, so an asker can tell an outage
// from an unknown id; an asker proving a request refuses both.
message ResolveSessionResponse {
  string sessionId = 1;
  string subject = 2;
  string partitionId = 3;
  google.protobuf.Timestamp expiresAt = 4;
  // Whether the sign-in that minted the session completed a second factor in
  // it. It is true only for a browser session: one a login surface set as its
  // cookie after the login verified the second factor, which for the sessions
  // node.orbtr.io holds is app.orbtr.io's. A session minted for a native app
  // never carries it, whatever the sign-in took. A verified-operator edge
  // admits only a session carrying it.
  bool secondFactor = 5;
  // Whether the session was minted for a native app at its sign-in code
  // exchange: the app holds the session id inside a bearer token, not a
  // browser cookie. A verified-operator edge refuses a session carrying it,
  // even when its id reaches the edge in a cookie.
  bool native = 6;
  // The session's anti-CSRF proof secret: the key of the proof a
  // cookie-authenticated change carries, which the edge the cookie arrives at
  // verifies (library security/requestproof) and renders into the page it
  // serves. It is set only when the request names the session by session_id,
  // the cookie's value, and the caller holds the session-resolve capability
  // directly, and never for a session carrying native, which no cookie
  // proves. Every other answer, a miss included, leaves it unset. It is a
  // secret: neither side logs it or records it in an audit fact.
  string proofSecret = 7 [debug_redact = true];
}


// LoginWithEmailCodeRequest is a login a surface took from a browser: the
// address the code was sent to and the code as entered. The surface passes
// both unchanged; the processing endpoint verifies them.
//
// client_ip and app are what the partition's access policy judges: the address
// the surface read the browser's request from and the surface's own configured
// application name. The caller is a surface holding the login-processing
// capability, which is why the processor takes them from the request.
message LoginWithEmailCodeRequest {
  string email = 1;
  string code = 2;
  string clientIp = 3 [(contracts.options.v1.caller) = CALLER_ADDRESS];
  string app = 4;
}


// LoginWithEmailCodeResponse is the session a processed login minted, and the
// token pair signed for it.
//
// session_id is the minted session's id in the processing endpoint's store,
// the value a surface sets as its session cookie; subject and partition are
// the session's; expires_at is its deadline, unset when the store gives it
// none. access_token and refresh_token are signed by the processing endpoint
// as issuer, each carrying session_id as its sid claim, so an edge proving a
// later request checks the token's signature and then resolves that session
// at the same endpoint. expires_in is the access token's lifetime in seconds.
//
// A refused login answers with every field unset, never with some of them: a
// wrong, expired or spent code, and an address with no account. A login the
// endpoint could not process, because a store or a seam it needs failed or is
// not configured, is an RPC error, never a refusal, so a surface can tell a
// wrong code from an outage.
message LoginWithEmailCodeResponse {
  string sessionId = 1;
  string subject = 2;
  string partitionId = 3;
  google.protobuf.Timestamp expiresAt = 4;
  string accessToken = 5;
  string refreshToken = 6;
  string tokenType = 7;
  int64 expiresIn = 8;
  // second_factor_required is set, with every other field unset, when the
  // code proved a subject whose login requires a second factor this endpoint
  // does not take. No session is minted for it.
  bool secondFactorRequired = 9;
  // sign_up_required is set, with sign_up_token and no other field, when the
  // code proved an address no subject holds. Nothing is created and no
  // session is minted; the login surface sends the browser to its sign-up
  // page carrying sign_up_token, which SignUp redeems.
  bool signUpRequired = 10;
  string signUpToken = 11;
  // second_factor_token is set with second_factor_required when the login can
  // continue: VerifySecondFactor redeems it with the code the person enters, or,
  // with second_factor_enrolment set, BeginSecondFactorEnrolment and
  // ConfirmSecondFactorEnrolment redeem it for a subject with none enrolled whose
  // partition requires one. A requirement that could not be read answers
  // second_factor_required with no token, and the login ends.
  string secondFactorToken = 12;
  bool secondFactorEnrolment = 13;
  // access_denied is set alone when the partition's access policy refuses the
  // login, naming which rule: ip_not_allowed, provider_not_allowed or
  // app_not_allowed. A policy that could not be read is an RPC error.
  string accessDenied = 14;
  // partitionChoiceToken is set, with partitionCandidates and no other field,
  // when the code proved a person holding several partitions whom the sign-in
  // ladder did not settle (a requested partition they hold, their default or
  // last used partition while still theirs, their only membership). The login
  // surface shows the candidates and ChoosePartition redeems the token with the
  // one the person chooses. No session is minted.
  string partitionChoiceToken = 15;
  repeated PartitionCandidate partitionCandidates = 16;
}


// PartitionCandidate is one partition a person stopped for a partition choice
// holds: partitionId, the opaque id ChoosePartition takes back, and displayName,
// the name the chooser shows, unset when none is known.
message PartitionCandidate {
  string partitionId = 1 [(contracts.options.v1.caller) = CALLER_PARTITION];
  string displayName = 2;
}


// IssueEmailLoginCodeRequest is the address a browser entered to be sent a
// login code.
message IssueEmailLoginCodeRequest {
  string email = 1;
}


// IssueEmailLoginCodeResponse carries nothing: the answer is the same whether
// or not the address holds an account. A code the endpoint could not record
// or send is an RPC error.
message IssueEmailLoginCodeResponse {
}


// StartProviderLoginRequest names the provider a browser chose and the
// return target the login surface took from the login page. code_challenge is
// the S256 PKCE challenge (RFC 7636) a native app sent with a native return as
// next; the processing endpoint signs it into the state, and the one-time code
// a completed login answers can be exchanged only with its verifier. device_id
// is the enrolled machine id a device runtime started its own login for, sent
// only with a code_challenge; it is signed into the state beside the challenge,
// and the exchange mints the session with it as the token audience.
message StartProviderLoginRequest {
  string provider = 1;
  string next = 2;
  string codeChallenge = 3;
  string deviceId = 4;
}


// StartProviderLoginResponse is the provider's authorization URL, carrying
// the signed state. An unknown or unconfigured provider answers with
// authorization_url unset.
message StartProviderLoginResponse {
  string authorizationUrl = 1;
}


// CompleteProviderLoginRequest is what the provider returned to the login
// surface's callback: the provider named in the callback path, the
// authorization code and the state.
message CompleteProviderLoginRequest {
  string provider = 1;
  string code = 2;
  string state = 3;
  // client_ip and app are LoginWithEmailCodeRequest's.
  string clientIp = 4 [(contracts.options.v1.caller) = CALLER_ADDRESS];
  string app = 5;
}


// CompleteProviderLoginResponse is the session a completed provider login
// minted and the token pair signed for it, with the fields
// LoginWithEmailCodeResponse carries, and next, the return target the signed
// state carried. A refused login (a state that does not verify, a provider
// that does not match it, a code the provider does not accept) answers with
// every field unset; second_factor_required set alone refuses a subject whose
// login requires a second factor; sign_up_required set with sign_up_token and
// no other field answers a provider identity no subject holds, which the login
// surface sends to its sign-up page carrying sign_up_token for SignUp. A login
// the endpoint could not process is an RPC error.
message CompleteProviderLoginResponse {
  string sessionId = 1;
  string subject = 2;
  string partitionId = 3;
  google.protobuf.Timestamp expiresAt = 4;
  string accessToken = 5;
  string refreshToken = 6;
  string tokenType = 7;
  int64 expiresIn = 8;
  bool secondFactorRequired = 9;
  string next = 10;
  bool signUpRequired = 11;
  string signUpToken = 12;
  // native_return is set, with no other field, when the state's return target
  // is a native app's return the processing endpoint honours: it is that return
  // carrying a one-time code bound to the state's code challenge, which the
  // app exchanges at the processing endpoint for its token pair, directly or
  // through a login surface's ExchangeNativeCode. No session is
  // minted until that exchange, and no token is in it; the login surface
  // redirects the browser to it and sets no cookie.
  string nativeReturn = 13;
  // second_factor_token, second_factor_enrolment and access_denied are
  // LoginWithEmailCodeResponse's.
  string secondFactorToken = 14;
  bool secondFactorEnrolment = 15;
  string accessDenied = 16;
  // partitionChoiceToken and partitionCandidates are
  // LoginWithEmailCodeResponse's; the token carries the state's return.
  string partitionChoiceToken = 17;
  repeated PartitionCandidate partitionCandidates = 18;
}


// SignUpRequest is the sign-up token a login surface's sign-up page took,
// passed on unchanged, and the partition name that page took. The token is short-lived and signed by the processing
// endpoint; it names the verified provider, the provider's subject id and the
// email address.
message SignUpRequest {
  string signUpToken = 1;
  // client_ip and app are LoginWithEmailCodeRequest's.
  string clientIp = 2 [(contracts.options.v1.caller) = CALLER_ADDRESS];
  string app = 3;
  // partitionName is the name the sign-up page took for the partition the
  // sign-up founds; the founding writes it as the partition's census name.
  // Empty founds a partition with no name.
  string partitionName = 4;
}


// SignUpResponse is the session SignUp minted into the partition it founded,
// and the token pair signed for it, with the fields
// LoginWithEmailCodeResponse carries.
//
// A token that does not verify or has expired answers with every field unset.
// identity_held set alone answers a token whose identity a subject already
// holds: nothing is created, and the person signs in instead.
// second_factor_required set alone answers a founding whose login stopped for
// a second factor: the partition and the subject were created, no session was
// minted. A sign-up the endpoint could not process is an RPC error.
message SignUpResponse {
  string sessionId = 1;
  string subject = 2;
  string partitionId = 3;
  google.protobuf.Timestamp expiresAt = 4;
  string accessToken = 5;
  string refreshToken = 6;
  string tokenType = 7;
  int64 expiresIn = 8;
  bool secondFactorRequired = 9;
  bool identityHeld = 10;
  // second_factor_token, second_factor_enrolment and access_denied are
  // LoginWithEmailCodeResponse's.
  string secondFactorToken = 11;
  bool secondFactorEnrolment = 12;
  string accessDenied = 13;
}


// RedeemHandoffRequest is the handoff token a browser arrived at the
// receiving origin with, passed on unchanged, and the receiving surface's own
// configured origin, which the token must have been issued for.
message RedeemHandoffRequest {
  string handoffToken = 1;
  string audience = 2;
  // client_ip is LoginWithEmailCodeRequest's; the application the access policy
  // judges is the audience's host.
  string clientIp = 3 [(contracts.options.v1.caller) = CALLER_ADDRESS];
}


// RedeemHandoffResponse is the session RedeemHandoff minted and the token pair
// signed for it, with the fields LoginWithEmailCodeResponse carries, and next,
// the same-origin path the token carried.
//
// A refused handoff answers with every field unset: a token that does not
// verify, has expired, was issued for another origin or was already redeemed,
// an origin the endpoint does not hand off to, and a handed-off session that
// has ended. A handoff the endpoint could not process is an RPC error.
message RedeemHandoffResponse {
  string sessionId = 1;
  string subject = 2;
  string partitionId = 3;
  google.protobuf.Timestamp expiresAt = 4;
  string accessToken = 5;
  string refreshToken = 6;
  string tokenType = 7;
  int64 expiresIn = 8;
  string next = 9;
  // access_denied is LoginWithEmailCodeResponse's: the receiving partition's
  // access policy refused the handoff, and no session was minted.
  string accessDenied = 10;
}


// VerifySecondFactorRequest is the second-factor token a login answered and the
// code the person entered: a time-step code or a backup code. client_ip and app
// are LoginWithEmailCodeRequest's, read again here because the code may arrive
// from another address than the login did.
message VerifySecondFactorRequest {
  string secondFactorToken = 1;
  string code = 2;
  string clientIp = 3 [(contracts.options.v1.caller) = CALLER_ADDRESS];
  string app = 4;
}


// VerifySecondFactorResponse is the session the verified login minted, with the
// fields LoginWithEmailCodeResponse carries, next, the return target the token
// carried, and native_return, set alone when that target is a native app's return,
// as on CompleteProviderLoginResponse.
//
// A token that does not verify, has expired or names no subject, a wrong or
// replayed code, and a subject that has spent its attempts answer with every field
// unset. access_denied is LoginWithEmailCodeResponse's. A login the endpoint could
// not process is an RPC error.
message VerifySecondFactorResponse {
  string sessionId = 1;
  string subject = 2;
  string partitionId = 3;
  google.protobuf.Timestamp expiresAt = 4;
  string accessToken = 5;
  string refreshToken = 6;
  string tokenType = 7;
  int64 expiresIn = 8;
  string next = 9;
  string nativeReturn = 10;
  string accessDenied = 11;
}


// ChoosePartitionRequest is the partition-choice token a login answered and the
// partition the person chose among its candidates. clientIp and app are
// LoginWithEmailCodeRequest's, read again here because the choice may arrive
// from another address than the login did.
message ChoosePartitionRequest {
  string partitionChoiceToken = 1;
  string partitionId = 2 [(contracts.options.v1.caller) = CALLER_PARTITION];
  string clientIp = 3 [(contracts.options.v1.caller) = CALLER_ADDRESS];
  string app = 4;
}


// ChoosePartitionResponse is the session the chosen partition's login minted,
// with VerifySecondFactorResponse's fields, or, when that partition requires a
// second factor, LoginWithEmailCodeResponse's second-factor stop.
//
// A token that does not verify or has expired, a partition outside its
// candidates and one the person no longer holds answer with every field unset.
// A login the endpoint could not process is an RPC error.
message ChoosePartitionResponse {
  string sessionId = 1;
  string subject = 2;
  string partitionId = 3;
  google.protobuf.Timestamp expiresAt = 4;
  string accessToken = 5;
  string refreshToken = 6;
  string tokenType = 7;
  int64 expiresIn = 8;
  string next = 9;
  string nativeReturn = 10;
  string accessDenied = 11;
  bool secondFactorRequired = 12;
  string secondFactorToken = 13;
  bool secondFactorEnrolment = 14;
}


// BeginSecondFactorEnrolmentRequest is the enrolment token a login answered.
message BeginSecondFactorEnrolmentRequest {
  string secondFactorToken = 1;
}


// BeginSecondFactorEnrolmentResponse is a factor the person has not yet proved:
// secret, base32, and otpauth_uri, the same secret as an authenticator reads it.
// Nothing is stored; ConfirmSecondFactorEnrolment takes the secret back with the
// code it produced. A token refused answers with every field unset.
message BeginSecondFactorEnrolmentResponse {
  string secret = 1;
  string otpauthUri = 2;
}


// ConfirmSecondFactorEnrolmentRequest is the enrolment token, the secret
// BeginSecondFactorEnrolment answered and the code the authenticator shows.
// client_ip and app are VerifySecondFactorRequest's.
message ConfirmSecondFactorEnrolmentRequest {
  string secondFactorToken = 1;
  string secret = 2;
  string code = 3;
  string clientIp = 4 [(contracts.options.v1.caller) = CALLER_ADDRESS];
  string app = 5;
}


// ConfirmSecondFactorEnrolmentResponse is the session the enrolled login minted,
// with the fields VerifySecondFactorResponse carries, and backup_codes, the
// recovery set in plaintext, the one time it leaves the credential store. A token
// or code refused answers with every field unset.
message ConfirmSecondFactorEnrolmentResponse {
  string sessionId = 1;
  string subject = 2;
  string partitionId = 3;
  google.protobuf.Timestamp expiresAt = 4;
  string accessToken = 5;
  string refreshToken = 6;
  string tokenType = 7;
  int64 expiresIn = 8;
  string next = 9;
  string nativeReturn = 10;
  string accessDenied = 11;
  repeated string backupCodes = 12;
}


// SwitchPartitionRequest names the caller's session, the id a surface's credential
// reader proved for this request, and the partition to switch it to. client_ip and
// app are LoginWithEmailCodeRequest's.
message SwitchPartitionRequest {
  string sessionId = 1 [(contracts.options.v1.caller) = CALLER_SESSION];
  string partitionId = 2 [(contracts.options.v1.caller) = CALLER_PARTITION];
  string clientIp = 3 [(contracts.options.v1.caller) = CALLER_ADDRESS];
  string app = 4;
}


// SwitchPartitionResponse is the session minted in the partition and the token
// pair signed for it, with the fields LoginWithEmailCodeResponse carries; the
// session the request named has ended. A session that does not prove and a subject
// not a member of the partition answer with every field unset, and the session
// keeps proving. second_factor_required with second_factor_enrolment answers a
// partition requiring a second factor of a subject with none enrolled.
// access_denied is LoginWithEmailCodeResponse's. A switch the endpoint could not
// process is an RPC error.
message SwitchPartitionResponse {
  string sessionId = 1;
  string subject = 2;
  string partitionId = 3;
  google.protobuf.Timestamp expiresAt = 4;
  string accessToken = 5;
  string refreshToken = 6;
  string tokenType = 7;
  int64 expiresIn = 8;
  bool secondFactorRequired = 9;
  bool secondFactorEnrolment = 10;
  string accessDenied = 11;
}


// ExchangeNativeCodeRequest is what a native app posted to a login surface's
// exchange route: the one-time code its return carried, the native return it
// was handed (redirect) and the PKCE verifier it kept from the login's start.
// client_ip and app are LoginWithEmailCodeRequest's.
message ExchangeNativeCodeRequest {
  string code = 1;
  string redirect = 2;
  string codeVerifier = 3;
  string clientIp = 4 [(contracts.options.v1.caller) = CALLER_ADDRESS];
  string app = 5;
}


// ExchangeNativeCodeResponse is the token pair signed for the session the
// exchange minted. A refused code (forged, expired, issued for another return,
// already exchanged, or presented with a verifier that does not meet its
// challenge) answers with every field unset; access_denied set alone names the
// partition access rule that refused the login, LoginWithEmailCodeResponse's.
// An exchange the endpoint could not process is an RPC error.
message ExchangeNativeCodeResponse {
  string accessToken = 1;
  string refreshToken = 2;
  string tokenType = 3;
  int64 expiresIn = 4;
  string accessDenied = 5;
}


// RefreshTokenPairRequest is what a client posted to a login surface's refresh
// route: the refresh token it holds and the client id the token was issued to.
// client_ip and app are LoginWithEmailCodeRequest's.
message RefreshTokenPairRequest {
  string refreshToken = 1;
  string clientId = 2;
  string clientIp = 3 [(contracts.options.v1.caller) = CALLER_ADDRESS];
  string app = 4;
}


// RefreshTokenPairResponse is the token pair signed for the rotated session. A
// refused refresh (a token that does not verify, is not a refresh token, names
// another client, or whose session no longer resolves) answers with every field
// unset; access_denied set alone names the partition access rule that refused
// it. A refresh the endpoint could not process is an RPC error.
message RefreshTokenPairResponse {
  string accessToken = 1;
  string refreshToken = 2;
  string tokenType = 3;
  int64 expiresIn = 4;
  string accessDenied = 5;
}


// GetTokenKeysRequest carries nothing: the keys are the processing endpoint's.
message GetTokenKeysRequest {
}


// TokenPublicKey is one Ed25519 public key a token verifies under. key_id is
// the version label the tokens signed under it carry as kid, empty for a key
// held with no version; public_key is the raw 32-byte key.
message TokenPublicKey {
  string keyId = 1;
  bytes publicKey = 2;
}


// GetTokenKeysResponse lists the keys the processing endpoint's tokens verify
// under, the current version first. An endpoint holding no verifier answers
// with an RPC error, never an empty list.
message GetTokenKeysResponse {
  repeated TokenPublicKey keys = 1;
}


// AccessPolicy is what a partition restricts a login or handoff into it by. An
// empty list restricts nothing on that axis.
//
// ip_ranges are the CIDR blocks and bare addresses a login may come from.
// providers are the sign-in providers a login may use. denied_apps are the
// applications no login into the partition may reach.
message AccessPolicy {
  repeated string ipRanges = 1;
  repeated string providers = 2;
  repeated string deniedApps = 3;
}


// GetAccessPolicyRequest carries nothing: the partition is the sealed caller's.
message GetAccessPolicyRequest {
}


// GetAccessPolicyResponse is the partition's policy, empty for one that never set
// one. A policy the endpoint could not read is an RPC error, never an empty policy.
message GetAccessPolicyResponse {
  AccessPolicy policy = 1;
}


// SetAccessPolicyRequest is the partition's new policy, replacing the one it held.
// An entry in ip_ranges that is neither a CIDR block nor an address is refused, and
// nothing is written.
message SetAccessPolicyRequest {
  AccessPolicy policy = 1;
}


message SetAccessPolicyResponse {
}


// GetSecondFactorPolicyRequest carries nothing: the partition is the sealed
// caller's.
message GetSecondFactorPolicyRequest {
}


// GetSecondFactorPolicyResponse answers whether the partition requires a
// second factor of every login into it. A partition that never set its policy
// answers false. A policy the endpoint could not read is an RPC error, never
// false.
message GetSecondFactorPolicyResponse {
  bool required = 1;
}


// SetSecondFactorPolicyRequest is the partition's new requirement.
message SetSecondFactorPolicyRequest {
  bool required = 1;
}


// SetSecondFactorPolicyResponse carries nothing: a write the endpoint could
// not make is an RPC error.
message SetSecondFactorPolicyResponse {
}


message Session {
  string id = 1;
  string userId = 2 [(contracts.options.v1.caller) = CALLER_SUBJECT];
  string audienceRoot = 3; // eTLD+1 for app-local sessions; empty for central
  string provider = 4; // auth provider (email/github/google/msft/etc.)
  google.protobuf.Timestamp issuedAt = 5;
  optional google.protobuf.Timestamp expiresAt = 6; // optional means session uses MaxAge semantics when not set
  google.protobuf.Timestamp lastUsedAt = 7;
  string browser = 8;
  string deviceType = 9;
  string platform = 10;
  string partitionId = 11 [(contracts.options.v1.caller) = CALLER_PARTITION];
  repeated string allowedApps = 12;
  repeated string allowedProviders = 13;
  bool requireMfa = 14;
}


message Time {
  // No fields defined in Go struct
}


message ValidateSessionHeadRequest {
  string sessionId = 1 [(contracts.options.v1.caller) = CALLER_SESSION]; // Required for server-to-server calls
}


message ValidateSessionHeadResponse {
  bool valid = 1;
  string userId = 2;
  string provider = 3;
  string error = 4;
}


message ValidateSessionRequest {
  string sessionId = 1 [(contracts.options.v1.caller) = CALLER_SESSION]; // Required for server-to-server calls
}


message ValidateSessionResponse {
  bool valid = 1;
  string userId = 2;
  string provider = 3;
  string error = 4;
}


message Verify2FARequest {
  string code = 1;
  string pendingSessionId = 2; // Optional: for RPC calls
  string nextUrl = 3;
  bool rememberDevice = 4;
  string deviceFingerprint = 5;
}


message Verify2FAResponse {
  bool success = 1;
  string message = 2;
  string redirectUrl = 3;
  string error = 4;
  bool locked = 5;
  int32 lockDuration = 6;
}


// VerifyStateRequest carries the signed state token returned to the OAuth
// callback from the provider. The token format is `<base64url-payload>.<base64url-sig>`
// where the signature is HMAC-SHA256 over the payload using the platform HMAC key.
message VerifyStateRequest {
  string state = 1;
}

// VerifyStateResponse returns the decoded StatePayload fields when the token
// is valid. When invalid, valid=false and error carries a human-readable reason
// (signature mismatch, token expired, disallowed origin, nonce replay, etc).
message VerifyStateResponse {
  bool valid = 1;
  string clientOrigin = 2;
  string next = 3;
  string deviceFingerprint = 4;
  string appId = 5;
  string partitionId = 6;
  string nonce = 7;
  string issuedAt = 8;   // RFC3339 timestamp
  int32 ttlSeconds = 9;
  string error = 10;
}


message VerifyHandoffRequest {
  string token = 1;
  string audience = 2;
}


message VerifyHandoffResponse {
  bool success = 1;
  string userId = 2;
  string dest = 3;
  string error = 4;
  string provider = 5;
  repeated string allowedProviders = 6;
  string partitionId = 7;
}


message VerifyRecoveryCodeRequest {
  string email = 1;
  string recoveryCode = 2;
}


message VerifyRecoveryCodeResponse {
  bool success = 1;
  string message = 2;
  string token = 3; // Temporary token for password reset
  string error = 4;
}

// ========== Design 1 (Pure Gateway Pattern) Messages ==========

// CompleteOAuth: Complete OAuth flow and return user/session data
message CompleteOAuthRequest {
  string provider = 1;           // OAuth provider name
  string oauthEmail = 2;        // Email from OAuth provider
  string oauthName = 3;         // Name from OAuth provider
  string oauthUserId = 4;      // Provider-specific user ID
  string oauthAccessToken = 5; // OAuth access token (optional)
  string destination = 6;        // Redirect destination after auth
  string deviceFingerprint = 7; // Device fingerprint for 2FA checks
  string appId = 8;             // App ID for access control
  string partitionId = 9 [(contracts.options.v1.caller) = CALLER_PARTITION];             // Organization ID for access control
}

message CompleteOAuthResponse {
  string userId = 1;        // HSTLES user ID
  string provider = 2;       // OAuth provider used
  string destination = 3;    // Final redirect destination
  bool requires2fa = 4;     // True if 2FA verification needed
  string error = 5;          // Error message if operation failed
  bool allowed = 6;          // True if user is allowed to access the app
  string denyReason = 7;    // Reason for denial if allowed is false
  repeated string requiredGroups = 8; // Groups required for access (if denied)
}

// ExchangeOAuthCode: Exchange authorization code for user profile on auth node.
// Called by gateways instead of gothic.CompleteUserAuth(). The auth node creates
// a transient goth provider with the caller's callback_url so the redirect_uri
// in the token exchange matches the one in the original authorization request.
message ExchangeOAuthCodeRequest {
  string provider = 1;      // OAuth provider name (google, microsoftonline, github)
  string code = 2;          // Authorization code from OAuth callback
  string callbackUrl = 3;  // Full callback URL used in the auth request (redirect_uri)
}

message ExchangeOAuthCodeResponse {
  string email = 1;              // User email from OAuth provider
  string name = 2;               // User display name
  string providerUserId = 3;   // Provider-specific user ID
  string accessToken = 4;       // OAuth access token
  string refreshToken = 5;      // OAuth refresh token (if available)
  string error = 6;              // Error message if exchange failed
}

// Check2FARequired: Check if user requires 2FA for this device
message Check2FARequiredRequest {
  string userId = 1 [(contracts.options.v1.caller) = CALLER_SUBJECT];            // User ID to check
  string deviceFingerprint = 2; // Device fingerprint (optional)
}

message Check2FARequiredResponse {
  bool required = 1;  // True if 2FA verification is required
  string error = 2;   // Error message if operation failed
}

// CreateEmailToken: Create and send email magic link token
message CreateEmailTokenRequest {
  string email = 1;           // Email address to send magic link to
  string destination = 2;     // Destination URL after login (optional)
}

message CreateEmailTokenResponse {
  bool success = 1;    // True if token created and email sent
  string error = 2;    // Error message if failed
  int64 retryAfter = 3; // Seconds to wait before retry (rate limiting)
  string code = 4;     // Derived 6-digit code for email template (derived from token_hash, not stored)
}

// ValidateEmailToken: Validate email magic link token
message ValidateEmailTokenRequest {
  string token = 1; // Email token from magic link
}

message ValidateEmailTokenResponse {
  bool valid = 1;    // True if token is valid
  string userId = 2; // User ID associated with token
  string email = 3;   // Email address associated with token
  string error = 4;   // Error message if invalid
}

// DeleteEmailToken: Delete (consume) email magic link token
message DeleteEmailTokenRequest {
  string token = 1; // Email token to delete/consume
}

message DeleteEmailTokenResponse {
  bool success = 1; // True if token was deleted
  string error = 2; // Error message if failed
}

// ValidateEmailCode: Validate 6-digit code derived from token hash (zero additional storage)
message ValidateEmailCodeRequest {
  string email = 1; // Email address the code was sent to
  string code = 2;  // 6-digit code entered by user
}

message ValidateEmailCodeResponse {
  bool valid = 1;     // True if code matches the derived code from token_hash
  string error = 2;   // Error message if invalid
  string userId = 3; // User ID (format "email:address@domain.com")
  string email = 4;   // Resolved email address
}

// MintSession: gateway-driven server-side session creation.
// Caller (thin gateway) supplies the metadata it gathered from the HTTP
// request; auth node generates the session_key, writes the row, returns
// the key the gateway sets in its Set-Cookie header.
message MintSessionRequest {
  string userId          = 1 [(contracts.options.v1.caller) = CALLER_SUBJECT]; // plaintext HSTLES user ID (FK target)
  string provider        = 2; // "google", "github", "email", ...
  string browser         = 3; // from User-Agent
  string deviceType      = 4; // "desktop", "mobile", ...
  string platform        = 5; // "Windows", "macOS", ...
  string partitionId     = 6 [(contracts.options.v1.caller) = CALLER_PARTITION]; // optional - preserved through handoff
  int64  maxAgeSeconds = 7; // session lifetime; <=0 means default
}

message MintSessionResponse {
  string sessionKey = 1; // gateway stores this in the session cookie
  string error       = 2;
}

// SaveUserProvider: Save OAuth provider linkage
message SaveUserProviderRequest {
  string userId = 1 [(contracts.options.v1.caller) = CALLER_SUBJECT];          // HSTLES user ID
  string provider = 2;         // OAuth provider name (google, github, etc)
  string providerUserId = 3; // Provider's user ID
  string accessToken = 4;     // OAuth access token
  string refreshToken = 5;    // OAuth refresh token (optional)
}

message SaveUserProviderResponse {
  bool success = 1; // True if saved successfully
  string error = 2; // Error message if failed
}

// ========== SSO Provider Status Messages ==========

// Info about a linked SSO provider
message UserProviderInfo {
  string provider = 1;        // "google", "github", "microsoft"
  bool enabled = 2;           // whether login via this provider is allowed
  int64 createdAt = 3;       // when first linked (unix timestamp)
  int64 updatedAt = 4;       // last updated (unix timestamp)
}

// ListUserProviders: Get all linked providers for authenticated user
message ListUserProvidersRequest {
  string sessionId = 1 [(contracts.options.v1.caller) = CALLER_SESSION];      // session ID (resolved to user_id via session)
}

message ListUserProvidersResponse {
  repeated UserProviderInfo providers = 1;
  string error = 2;
}

// UpdateProviderStatus: Enable or disable a provider for login
message UpdateProviderStatusRequest {
  string sessionId = 1 [(contracts.options.v1.caller) = CALLER_SESSION];      // session ID (resolved to user_id)
  string provider = 2;        // provider name (google, github, microsoft)
  bool enabled = 3;           // true=allow login, false=disable login
}

message UpdateProviderStatusResponse {
  bool success = 1;
  string error = 2;
}

// ========== JWT Token Management Messages ==========

// IssueToken: Issue new access + refresh token pair
message IssueTokenRequest {
  string userId = 1 [(contracts.options.v1.caller) = CALLER_SUBJECT];    // User ID to issue tokens for
  string provider = 2;   // Auth provider (oauth provider or "email")
  string clientId = 3;  // Client application identifier
  string deviceId = 4;  // Device fingerprint/identifier
  int64 sessionId = 5;  // Session ID to link tokens to
  string ipAddress = 6; // Client IP at issuance (for audit)
  string userAgent = 7; // User agent at issuance (for audit)
  repeated string allowedProviders = 8; // Allowed providers for this user/session
  string partitionId = 9 [(contracts.options.v1.caller) = CALLER_PARTITION]; // Active Organization ID to preserve context
  repeated string scopes = 10; // RBAC scopes to embed in access token (empty = resolve from org roles)
}

message IssueTokenResponse {
  string accessToken = 1;   // JWT access token (short-lived)
  string refreshToken = 2;  // JWT refresh token (long-lived)
  string tokenType = 3;     // Token type ("Bearer")
  int64 expiresIn = 4;      // Access token lifetime in seconds
  string error = 5;          // Error message if failed
}

// RefreshToken: Refresh access token using refresh token
message RefreshTokenRequest {
  string refreshToken = 1;  // Current refresh token
  string clientId = 2;      // Client application identifier
}

message RefreshTokenResponse {
  string accessToken = 1;   // New JWT access token
  string refreshToken = 2;  // New JWT refresh token (rotated)
  string tokenType = 3;     // Token type ("Bearer")
  int64 expiresIn = 4;      // Access token lifetime in seconds
  string error = 5;          // Error message if failed
}

// RevokeToken: Revoke access or refresh token
message RevokeTokenRequest {
  string token = 1;           // Token to revoke
  string tokenTypeHint = 2; // "access_token" or "refresh_token" (optional hint)
}

message RevokeTokenResponse {
  bool success = 1;  // Always true per OAuth 2.0 spec
  string error = 2;  // Error message (for logging only)
}

// IntrospectToken: Validate token and return claims
message IntrospectTokenRequest {
  string token = 1;           // Token to introspect
  string tokenTypeHint = 2; // "access_token" or "refresh_token" (optional)
}

message IntrospectTokenResponse {
  bool active = 1;       // True if token is valid and not revoked
  string sub = 2;        // Subject (user ID)
  string iss = 3;        // Issuer
  string aud = 4;        // Audience (client ID)
  int64 exp = 5;         // Expiration timestamp
  int64 iat = 6;         // Issued at timestamp
  string jti = 7;        // JWT ID (unique identifier)
  string scope = 8;      // Space-separated scopes
  string provider = 9;   // Auth provider
  string error = 10;     // Error message if introspection failed
}

// ValidateBearerToken: Validate bearer token for SecurityCore middleware
message ValidateBearerTokenRequest {
  string token = 1;  // Bearer token from Authorization header
}

message ValidateBearerTokenResponse {
  bool valid = 1;             // True if token is valid
  string userId = 2;         // User ID from token
  repeated string scopes = 3; // Permission scopes from token
  string provider = 4;        // Auth provider from token
  string authType = 5;       // Auth type ("bearer")
  string error = 6;           // Error message if invalid
}

// RevokeAllUserTokens: Revoke all tokens for a user (logout from all devices)
message RevokeAllUserTokensRequest {
  string userId = 1 [(contracts.options.v1.caller) = CALLER_SUBJECT];  // User ID to revoke all tokens for
}

message RevokeAllUserTokensResponse {
  int64 revokedCount = 1; // Number of tokens revoked
  string error = 2;        // Error message if failed
}

// SwitchContext: Switch active organization context
message SwitchContextRequest {
  string partitionId = 1 [(contracts.options.v1.caller) = CALLER_PARTITION];    // Organization ID to switch to (empty for personal context)
  string clientIp = 2 [(contracts.options.v1.caller) = CALLER_ADDRESS]; // Client IP address for org access policy check
  string appId = 3;    // Application ID for org access policy check
}

message SwitchContextResponse {
  bool success = 1; // True if context switched successfully
  string error = 2; // Error message if failed
}

// DescribeCallerRequest names nothing: the caller described is the proved one.
message DescribeCallerRequest {}

// DescribeCallerResponse is the proved caller as the serving endpoint knows it
// when it answers.
message DescribeCallerResponse {
  string subject = 1;
  string partitionId = 2;
  string sessionId = 3;
  // When the session stops proving; unset for a session with no deadline.
  google.protobuf.Timestamp expiresAt = 4;
  string displayName = 5;
  string email = 6;
  string partitionName = 7;
  // The capabilities the caller holds now, as its grants resolved for this
  // request.
  repeated string capabilities = 8;
  // The plan features the caller's plan includes.
  repeated string entitlements = 9;
  // The key of the caller's plan in the partition (free, pro, max, ...), the
  // plan whose features entitlements lists; empty when the caller holds no
  // plan there.
  string plan = 10;
}

// SpendIDRequest names the id to spend, the namespace it is spent in (the
// asking endpoint's lower-case host name) and the instant after which it may
// be spent again, at most an hour past the host's clock.
message SpendIDRequest {
  string namespace = 1;
  string id = 2;
  google.protobuf.Timestamp expiresAt = 3;
}

// SpendIDResponse answers first true when no unexpired spend of the id in its
// namespace preceded this call.
message SpendIDResponse {
  bool first = 1;
}
