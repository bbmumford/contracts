syntax = "proto3";

package contracts.notify.v1;

import "google/api/annotations.proto";
import "contracts/options/v1/options.proto";

option go_package = "github.com/bbmumford/contracts/notify/protobuf;protobuf";

// NotifyService provides notification operations over gRPC and HTTP
// All endpoints are SERVICE-level (internal service-to-service only)
service NotifyService {
  // Queue email for delivery (versatile handler for all email types)
  rpc QueueEmail(QueueEmailRequest) returns (QueueEmailResponse) {
    option (google.api.http) = {
      post: "/api/notify/queue"
      body: "*"
    };
  }

  // Send generic email with custom content
  rpc SendGenericEmail(SendGenericEmailRequest) returns (SendGenericEmailResponse) {
    option (google.api.http) = {
      post: "/api/notify/email/generic"
      body: "*"
    };
  }

  // Send magic login link email
  rpc SendLoginLinkEmail(SendLoginLinkEmailRequest) returns (SendLoginLinkEmailResponse) {
    option (google.api.http) = {
      post: "/api/notify/email/login-link"
      body: "*"
    };
  }

  // Send recovery code email
  rpc SendRecoveryCodeEmail(SendRecoveryCodeEmailRequest) returns (SendRecoveryCodeEmailResponse) {
    option (google.api.http) = {
      post: "/api/notify/email/recovery-code"
      body: "*"
    };
  }

  // Send 2FA security code email
  rpc SendSecurityCodeEmail(SendSecurityCodeEmailRequest) returns (SendSecurityCodeEmailResponse) {
    option (google.api.http) = {
      post: "/api/notify/email/security-code"
      body: "*"
    };
  }

  // Send service alert email
  rpc SendServiceAlertEmail(SendServiceAlertEmailRequest) returns (SendServiceAlertEmailResponse) {
    option (google.api.http) = {
      post: "/api/notify/email/service-alert"
      body: "*"
    };
  }

  // Send welcome email to new user
  rpc SendWelcomeEmail(SendWelcomeEmailRequest) returns (SendWelcomeEmailResponse) {
    option (google.api.http) = {
      post: "/api/notify/email/welcome"
      body: "*"
    };
  }

  // ========== Notification Pipeline (per partition, persistent) ==========

  // Send a notification to one subject (persists + routes to channels)
  rpc SendNotification(SendNotificationRequest) returns (SendNotificationResponse) {
    option (google.api.http) = {
      post: "/api/notify/send"
      body: "*"
    };
  }

  // Send a notification to several subjects of the partition
  rpc SendBulkNotification(SendBulkNotificationRequest) returns (SendBulkNotificationResponse) {
    option (google.api.http) = {
      post: "/api/notify/send-bulk"
      body: "*"
    };
  }

  // List one subject's notifications (paginated)
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse) {
    option (google.api.http) = {
      post: "/api/notify/list"
      body: "*"
    };
  }

  // Get unread notification count for badge display
  rpc GetUnreadCount(GetUnreadCountRequest) returns (GetUnreadCountResponse) {
    option (google.api.http) = {
      post: "/api/notify/unread-count"
      body: "*"
    };
  }

  // Mark notification(s) as read
  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse) {
    option (google.api.http) = {
      post: "/api/notify/mark-read"
      body: "*"
    };
  }

  // Mark all of one subject's notifications as read
  rpc MarkAllRead(MarkAllReadRequest) returns (MarkAllReadResponse) {
    option (google.api.http) = {
      post: "/api/notify/mark-all-read"
      body: "*"
    };
  }

  // Dismiss (hide) a notification
  rpc DismissNotification(DismissNotificationRequest) returns (DismissNotificationResponse) {
    option (google.api.http) = {
      post: "/api/notify/dismiss"
      body: "*"
    };
  }

  // Poll for new notifications since a timestamp
  rpc PollNotifications(PollNotificationsRequest) returns (PollNotificationsResponse) {
    option (google.api.http) = {
      post: "/api/notify/poll"
      body: "*"
    };
  }

  // Get a subject's notification channel preferences
  rpc GetNotificationPreferences(GetNotificationPreferencesRequest) returns (GetNotificationPreferencesResponse) {
    option (google.api.http) = {
      post: "/api/notify/preferences/get"
      body: "*"
    };
  }

  // Update a subject's notification channel preferences
  rpc UpdateNotificationPreferences(UpdateNotificationPreferencesRequest) returns (UpdateNotificationPreferencesResponse) {
    option (google.api.http) = {
      post: "/api/notify/preferences/update"
      body: "*"
    };
  }

  // ========== Push Tokens (per partition) ==========

  // Register a push device token (FCM or APNS) for a subject
  rpc RegisterPushToken(RegisterPushTokenRequest) returns (RegisterPushTokenResponse) {
    option (google.api.http) = {
      post: "/api/notify/push/register"
      body: "*"
    };
  }

  // Invalidate a push device token (logout / device unlink)
  rpc UnregisterPushToken(UnregisterPushTokenRequest) returns (UnregisterPushTokenResponse) {
    option (google.api.http) = {
      post: "/api/notify/push/unregister"
      body: "*"
    };
  }
}

// ========== Enums ==========

enum NotificationChannel {
  CHANNEL_UNSPECIFIED = 0;
  CHANNEL_IN_APP = 1;
  CHANNEL_EMAIL = 2;
  CHANNEL_PUSH = 3;      // Future
  CHANNEL_SMS = 4;       // Future
  CHANNEL_WEBHOOK = 5;   // Future
}

enum NotificationPriority {
  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_LOW = 1;
  PRIORITY_NORMAL = 2;
  PRIORITY_HIGH = 3;
  PRIORITY_CRITICAL = 4;
}

// ========== Email Request/Response Messages (existing) ==========

message QueueEmailRequest {
  string kind = 1; // welcome | recovery-code | security-code | service-alert | login-link | generic
  string to = 2;
  string username = 3;
  string code = 4;
  string loginLink = 5;
  string subject = 6;
  string message = 7;
  string alertTitle = 8;
  string alertMessage = 9;
}


message QueueEmailResponse {
  bool success = 1;
  string error = 2;
}


message SendGenericEmailRequest {
  string to = 1;
  string subject = 2;
  string message = 3;
}


message SendGenericEmailResponse {
  bool success = 1;
  string error = 2;
}


message SendLoginLinkEmailRequest {
  string to = 1;
  string loginLink = 2;
  string username = 3;
}


message SendLoginLinkEmailResponse {
  bool success = 1;
  string error = 2;
}


message SendRecoveryCodeEmailRequest {
  string to = 1;
  string username = 2;
  string code = 3;
}


message SendRecoveryCodeEmailResponse {
  bool success = 1;
  string error = 2;
}


message SendSecurityCodeEmailRequest {
  string to = 1;
  string code = 2;
}


message SendSecurityCodeEmailResponse {
  bool success = 1;
  string error = 2;
}


message SendServiceAlertEmailRequest {
  string to = 1;
  string alertTitle = 2;
  string alertMessage = 3;
}


message SendServiceAlertEmailResponse {
  bool success = 1;
  string error = 2;
}


message SendWelcomeEmailRequest {
  string to = 1;
  string username = 2;
}


message SendWelcomeEmailResponse {
  bool success = 1;
  string error = 2;
}


// ========== Notification Pipeline Messages ==========

message Notification {
  // A notification is read back through an inbox the caller has already scoped:
  // the host resolves the partition and the subject from the proved caller and
  // refuses when either is absent, so carrying them back on every row restates
  // what the request established. Field 2 held the partition and is reserved
  // rather than reused — a row echoing a scope it did not decide invites a
  // reader to treat the echo as authority.
  reserved 2;
  reserved "tenantId";

  string notificationId = 1;
  string subject = 3;
  string category = 4;              // "device.enrollment", "policy.updated", "billing.expiring"
  string title = 5;
  string body = 6;
  NotificationPriority priority = 7;
  string actionUrl = 8;            // Deep link for click-to-navigate
  string sourceService = 9;        // "orbtr", "billing", "auth"
  string sourceEntityId = 10;
  map<string, string> metadata = 11;
  bool read = 12;
  bool dismissed = 13;
  int64 createdAt = 14;
  int64 readAt = 15;
  int64 dismissedAt = 16;
  repeated NotificationChannel deliveredVia = 17;
}

message NotificationPreference {
  string category = 1;     // e.g. "device.offline", "*" for default
  bool inApp = 2;
  bool email = 3;
  bool push = 4;
  bool sms = 5;
}

// --- SendNotification ---

message SendNotificationRequest {
  string subject = 1;
  string category = 2;
  string title = 3;
  string body = 4;
  NotificationPriority priority = 5;
  string actionUrl = 6;
  string sourceService = 7;
  string sourceEntityId = 8;
  map<string, string> metadata = 9;
  repeated NotificationChannel channels = 10;  // Override default routing; empty = use preferences
  string emailSubject = 11;                   // Used when email channel is selected
  string emailTo = 12;                        // Email address of the recipient named in subject = 1, when it differs from the one that subject resolves to; not the emailSubject line above
}

message SendNotificationResponse {
  bool success = 1;
  string error = 2;
  string notificationId = 3;
}

// --- SendBulkNotification ---

message SendBulkNotificationRequest {
  repeated string subjects = 1;
  string category = 2;
  string title = 3;
  string body = 4;
  NotificationPriority priority = 5;
  string actionUrl = 6;
  string sourceService = 7;
  string sourceEntityId = 8;
  map<string, string> metadata = 9;
  repeated NotificationChannel channels = 10;
  string emailSubject = 11;
}

message SendBulkNotificationResponse {
  bool success = 1;
  string error = 2;
  int32 sentCount = 3;
  repeated string notificationIds = 4;
}

// --- ListNotifications ---

message ListNotificationsRequest {
  string subject = 1;
  string category = 2;        // Optional filter
  bool unreadOnly = 3;
  int32 limit = 4;            // Default 20, max 100
  string cursor = 5;          // Cursor for pagination (notificationId)
}

message ListNotificationsResponse {
  bool success = 1;
  string error = 2;
  repeated Notification notifications = 3;
  string nextCursor = 4;
  int32 unreadCount = 5;
}

// --- GetUnreadCount ---

message GetUnreadCountRequest {
  string subject = 1;
}

message GetUnreadCountResponse {
  int32 count = 1;
  int64 latestAt = 2;   // Timestamp of newest unread notification
}

// --- MarkRead ---

message MarkReadRequest {
  string subject = 1;
  repeated string notificationIds = 2;
}

message MarkReadResponse {
  bool success = 1;
  string error = 2;
  int32 updatedCount = 3;
}

// --- MarkAllRead ---

message MarkAllReadRequest {
  string subject = 1;
}

message MarkAllReadResponse {
  bool success = 1;
  string error = 2;
  int32 updatedCount = 3;
}

// --- DismissNotification ---

message DismissNotificationRequest {
  string subject = 1;
  string notificationId = 2;
}

message DismissNotificationResponse {
  bool success = 1;
  string error = 2;
}

// --- PollNotifications ---

message PollNotificationsRequest {
  string subject = 1;
  int64 sinceUnix = 2;       // Return notifications created after this timestamp
}

message PollNotificationsResponse {
  repeated Notification notifications = 1;
  int32 unreadCount = 2;
}

// --- GetNotificationPreferences ---

message GetNotificationPreferencesRequest {
  string subject = 1;
}

message GetNotificationPreferencesResponse {
  bool success = 1;
  string error = 2;
  repeated NotificationPreference preferences = 3;
}

// --- UpdateNotificationPreferences ---

message UpdateNotificationPreferencesRequest {
  string subject = 1;
  repeated NotificationPreference preferences = 2;
}

message UpdateNotificationPreferencesResponse {
  bool success = 1;
  string error = 2;
}

// --- RegisterPushToken ---

message RegisterPushTokenRequest {
  string subject = 1;
  string deviceToken = 2;
  // "android" or "ios"
  string platform = 3;
  // App identifier (defaults to "encntr" when empty)
  string appId = 4;
}

message RegisterPushTokenResponse {
  bool success = 1;
  string error = 2;
}

// --- UnregisterPushToken ---

message UnregisterPushTokenRequest {
  string subject = 1;
  string deviceToken = 2;
}

message UnregisterPushTokenResponse {
  bool success = 1;
  string error = 2;
}
