syntax = "proto3";

package contracts.identity.v1;

option go_package = "github.com/bbmumford/contracts/identity/protobuf;protobuf";

// Requests and responses of the orbtr.identity role and override operations:
// a partition's stored roles (ListRoles, CreateRole, UpdateRole, DeleteRole), a
// role assignment's removal (RevokeRole), and a subject's per-capability
// overrides (SetSubjectOverride, ClearSubjectOverride, ListSubjectOverrides).
//
// Every operation acts in the partition the caller's seal names; no request
// carries a partition. The editor (granted_by, set_by) is the proved caller and
// is never read from a request. A refusal is a transport error, never an in-band
// result field.

// RoleDefinition is one role a partition stores.
//
// entries is the role's list as authored: a capability orbtr:<family>.<verb> or
// a family at a tier, <family>@read, <family>@operate or <family>@manage. A
// built-in role carries the family-at-tier entries its tier amounts to over the
// families the partition holds. effective is what the role confers there now:
// its entries expanded over those families, as member-realm dotted scopes.
message RoleDefinition {
  string role_id       = 1;
  string name          = 2;
  string description   = 3;
  bool   built_in      = 4;
  // assignable_at is where the role may be assigned: partition, space or both.
  string assignable_at = 5;
  repeated string entries   = 6;
  repeated string effective = 7;
  // revision is the value UpdateRoleRequest.expected_revision must carry.
  string revision      = 8;
  // holder_count is the number of live assignments of the role at the partition.
  int64  holder_count  = 9;
}

// FamilyVocabulary is one capability family a partition holds, with the verbs
// each tier of it confers.
message FamilyVocabulary {
  string family           = 1;
  repeated string read    = 2;
  repeated string operate = 3;
  repeated string manage  = 4;
}

message ListRoleDefinitionsRequest {}

// ListRoleDefinitionsResponse lists the partition's live roles, built-ins first,
// and the vocabulary of the families it holds, which is what a role there can name.
message ListRoleDefinitionsResponse {
  repeated RoleDefinition   roles      = 1;
  repeated FamilyVocabulary vocabulary = 2;
}

message CreateRoleDefinitionRequest {
  string name          = 1;
  string description   = 2;
  string assignable_at = 3;
  repeated string entries = 4;
}

message CreateRoleDefinitionResponse {
  RoleDefinition role = 1;
}

// RoleEntryList carries a role's replacement entries, so an update can tell an
// empty list from no change.
message RoleEntryList {
  repeated string entries = 1;
}

// UpdateRoleDefinitionRequest revises a custom role. A field left unset is left
// as it is.
message UpdateRoleDefinitionRequest {
  string role_id           = 1;
  string expected_revision = 2;
  optional string name        = 3;
  optional string description = 4;
  RoleEntryList   entries     = 5;
}

message UpdateRoleDefinitionResponse {
  RoleDefinition role = 1;
}

message DeleteRoleDefinitionRequest {
  string role_id = 1;
}

// DeleteRoleDefinitionResponse counts the assignments the deletion revoked.
message DeleteRoleDefinitionResponse {
  int64 removed_assignments = 1;
}

message RevokeRoleRequest {
  string subject_id = 1;
  string role_id    = 2;
}

// RevokeRoleResponse reports not_assigned when the subject held no live
// assignment of the role, which is not a refusal.
message RevokeRoleResponse {
  bool not_assigned = 1;
}

// SetSubjectOverrideRequest sets one override on a member: capability is
// orbtr:<family>.<verb>; effect is grant or deny.
message SetSubjectOverrideRequest {
  string subject_id = 1;
  string capability = 2;
  string effect     = 3;
}

message SetSubjectOverrideResponse {}

message ClearSubjectOverrideRequest {
  string subject_id = 1;
  string capability = 2;
}

// ClearSubjectOverrideResponse reports not_set when the subject held no override
// of the capability, which is not a refusal.
message ClearSubjectOverrideResponse {
  bool not_set = 1;
}

// SubjectOverride is one override a member holds. active is false for a grant
// override on a membership that is not a person's, which confers nothing.
message SubjectOverride {
  string capability = 1;
  string effect     = 2;
  string set_by     = 3;
  string set_at     = 4;
  bool   active     = 5;
}

message ListSubjectOverridesRequest {
  string subject_id = 1;
}

message ListSubjectOverridesResponse {
  repeated SubjectOverride overrides = 1;
}
