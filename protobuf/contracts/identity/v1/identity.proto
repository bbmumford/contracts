// ========== Member Role Assignments ==========

message GrantRoleRequest {
  string subjectId = 1;
  string roleId    = 2;
}

// GrantRoleResponse reports alreadyAssigned when the subject held a live
// assignment of the role at the partition, which is answered before any other
// check and is not a refusal.
message GrantRoleResponse {
  bool alreadyAssigned = 1;
}

message RemoveMemberRoleRequest {
  string partitionId    = 1 [(contracts.options.v1.caller) = CALLER_PARTITION];
  string userId         = 2 [(contracts.options.v1.caller) = CALLER_SUBJECT];
  string roleId         = 3;
}

message RemoveMemberRoleResponse {
  bool   success      = 1;
  bool   notAssigned = 2; // true when row didn't exist — still success (idempotent)
  string error        = 3;
}

message MemberRoleEntry {
  string roleId    = 1;
  string grantedBy = 2;
  string grantedAt = 3; // RFC3339 timestamp
}

message ListSubjectRolesRequest {
  string subjectId = 1;
}

// ListSubjectRolesResponse carries roles, the role edges a subject holds as the
// readers of that edge consume them, and assignments, the subject's stored role
// assignments at the partition.
message ListSubjectRolesResponse {
  repeated RoleGrant      roles       = 1;
  repeated RoleAssignment assignments = 2;
}

// RoleAssignment is one stored assignment of a role to a subject. scope is
// "partition" for an assignment at the partition. active is false when the role
// is no longer live there, so the assignment confers nothing.
message RoleAssignment {
  string roleId    = 1;
  string name       = 2;
  bool   builtIn   = 3;
  string scope      = 4;
  string grantedBy = 5;
  string grantedAt = 6;
  bool   active     = 7;
}

message ResolveMemberScopesRequest {
  string partitionId    = 1 [(contracts.options.v1.caller) = CALLER_PARTITION];
  string userId         = 2 [(contracts.options.v1.caller) = CALLER_SUBJECT];
  // "admin" | "member" | "" — drives fallback when user has no explicit roles.
  string memberStatus   = 3;
}

message ResolveMemberScopesResponse {
  bool            success = 1;
  // Deduplicated union of role-attached permissions. Always includes
  // "authenticated" when at least one explicit role resolves; admin
  // fallback (no explicit roles + memberStatus="admin") yields ["*"].
  repeated string scopes  = 2;
  string          error   = 3;
}

// ========== Organisation Settings ==========

message OrgSetting {
  string key        = 1; // namespaced key (e.g. "quorum.tenant.cidr_allowlist")
  string value      = 2; // JSON-encoded; caller domain interprets the shape
  string updatedAt = 3; // RFC3339 timestamp of last write
  string updatedBy = 4; // userId who performed the last write
}

message GetOrgSettingsRequest {
  string          partitionId    = 1 [(contracts.options.v1.caller) = CALLER_PARTITION];
  repeated string keys            = 2; // optional projection; empty = all settings
}

message GetOrgSettingsResponse {
  bool                success  = 1;
  repeated OrgSetting settings = 2;
  string              error    = 3;
}

message PutOrgSettingsRequest {
  string              partitionId    = 1 [(contracts.options.v1.caller) = CALLER_PARTITION];
  repeated OrgSetting settings        = 2; // upsert by key; empty value deletes
  string              updatedBy      = 3;
}

message PutOrgSettingsResponse {
  bool   success = 1;
  int32  written = 2; // number of rows upserted (or deleted)
  string error   = 3;
}

// ========== Per-User Capability Overrides ==========

message CapabilityOverrideEntry {
  string scope  = 1;
  string effect = 2; // "grant" | "deny"
  string setBy = 3;
  string setAt = 4;
}

message SetMemberCapabilityOverrideRequest {
  string partitionId    = 1 [(contracts.options.v1.caller) = CALLER_PARTITION];
  string userId         = 2 [(contracts.options.v1.caller) = CALLER_SUBJECT];
  string scope           = 3;
  string effect          = 4; // "grant" | "deny"
  string setBy          = 5;
}

message SetMemberCapabilityOverrideResponse {
  bool   success = 1;
  string error   = 2;
}

message ListMemberCapabilityOverridesRequest {
  string partitionId    = 1 [(contracts.options.v1.caller) = CALLER_PARTITION];
  string userId         = 2 [(contracts.options.v1.caller) = CALLER_SUBJECT];
}

message ListMemberCapabilityOverridesResponse {
  bool                              success   = 1;
  repeated CapabilityOverrideEntry  overrides = 2;
  string                            error     = 3;
}

message ClearMemberCapabilityOverrideRequest {
  string partitionId    = 1 [(contracts.options.v1.caller) = CALLER_PARTITION];
  string userId         = 2 [(contracts.options.v1.caller) = CALLER_SUBJECT];
  string scope           = 3;
}

message ClearMemberCapabilityOverrideResponse {
  bool   success = 1;
  string error   = 2;
}
