syntax = "proto3";

package contracts.identity.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "contracts/options/v1/options.proto";
// resolve_membership.proto defines ResolveMembership's request and response;
// the IdentityService rpc below references them, so this file imports it.
import "contracts/identity/v1/resolve_membership.proto";

option go_package = "github.com/bbmumford/contracts/identity/protobuf;protobuf";

// IdentityService provides identity operations over gRPC and HTTP
service IdentityService {
  // ========== User Management ==========

  // Create a new user (called by auth service after registration)
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (google.api.http) = {
      post: "/api/users"
      body: "*"
    };
  }

  // List users with pagination
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {
      get: "/api/users"
    };
  }

  // Retrieve a user by ID
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option (google.api.http) = {
      get: "/api/users/{userId}"
    };
  }

  // Update an existing user
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse) {
    option (google.api.http) = {
      put: "/api/users/{userId}"
      body: "*"
    };
    option (contracts.options.v1.rateLimit) = RATE_LIMIT_STRICT;
  }

  // Delete a user by ID
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {
    option (google.api.http) = {
      delete: "/api/users/{userId}"
    };
  }

  // Retrieve a user by email address
  rpc GetUserByEmail(GetUserByEmailRequest) returns (GetUserByEmailResponse) {
    option (google.api.http) = {
      get: "/api/users/by-email"
    };
  }

  // List organizations a user belongs to
  rpc ListSubjectPartitions(ListSubjectPartitionsRequest) returns (ListSubjectPartitionsResponse) {
  }

  // ========== Organization Management ==========

  // Create a new organization
  rpc CreatePartition(CreatePartitionRequest) returns (CreatePartitionResponse) {
  }

  // List organizations with pagination
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse) {
    option (google.api.http) = {
      get: "/api/organizations"
    };
  }

  // Retrieve an organization by ID
  rpc GetOrganization(GetOrganizationRequest) returns (GetOrganizationResponse) {
    option (google.api.http) = {
      get: "/api/organizations/{orgId}"
    };
  }

  // Update an existing organization
  rpc UpdateOrganization(UpdateOrganizationRequest) returns (UpdateOrganizationResponse) {
    option (google.api.http) = {
      put: "/api/organizations/{orgId}"
      body: "*"
    };
  }

  // ========== Group Management (Per-Org) ==========

  // Sync external groups (Google/M365) to internal organisation groups
  rpc SyncExternalGroups(SyncExternalGroupsRequest) returns (SyncExternalGroupsResponse) {
    option (google.api.http) = {
      post: "/api/org/{orgId}/groups/sync"
      body: "*"
    };
  }

  // List groups for an organisation
  rpc ListOrgGroups(ListOrgGroupsRequest) returns (ListOrgGroupsResponse) {
    option (google.api.http) = {
      get: "/api/org/{orgId}/groups"
    };
  }

  // List the group ids a user belongs to within an organisation. This is the
  // canonical membership a product plane resolves at authorisation time so a
  // deprovisioned user stops resolving to any group.
  rpc ListUserGroups(ListUserGroupsRequest) returns (ListUserGroupsResponse) {
    option (google.api.http) = {
      get: "/api/org/{orgId}/users/{userId}/groups"
    };
  }

  // ========== App Access Control ==========

  // Check if a user has access to a specific app
  rpc CheckAppAccess(CheckAppAccessRequest) returns (CheckAppAccessResponse) {
    option (google.api.http) = {
      get: "/api/org/{orgId}/apps/{appId}/access"
    };
  }

  // Update access rules for an app (e.g. assign group to app)
  rpc UpdateAppAccess(UpdateAppAccessRequest) returns (UpdateAppAccessResponse) {
    option (google.api.http) = {
      put: "/api/org/{orgId}/apps/{appId}/access"
      body: "*"
    };
  }

  // Delete an organization by ID
  rpc DeleteOrganization(DeleteOrganizationRequest) returns (DeleteOrganizationResponse) {
    option (google.api.http) = {
      delete: "/api/organizations/{orgId}"
    };
  }

  // ========== App Management ==========

  // List available global services (registry)
  rpc ListGlobalServices(ListGlobalServicesRequest) returns (ListGlobalServicesResponse) {
    option (google.api.http) = {
      get: "/api/services"
    };
  }

  // List enabled apps for an organisation
  rpc ListEnabledApps(ListEnabledAppsRequest) returns (ListEnabledAppsResponse) {
    option (google.api.http) = {
      get: "/api/org/{orgId}/apps"
    };
  }

  // Enable an app for an organisation (create policy)
  rpc EnableApp(EnableAppRequest) returns (EnableAppResponse) {
    option (google.api.http) = {
      post: "/api/org/{orgId}/apps"
      body: "*"
    };
  }

  // Get app policy and access rules
  rpc GetAppPolicy(GetAppPolicyRequest) returns (GetAppPolicyResponse) {
    option (google.api.http) = {
      get: "/api/org/{orgId}/apps/{appId}/policy"
    };
  }

  // Update app configuration/policy
  rpc UpdateAppConfig(UpdateAppConfigRequest) returns (UpdateAppConfigResponse) {
    option (google.api.http) = {
      put: "/api/org/{orgId}/apps/{appId}"
      body: "*"
    };
  }

  // Disable an app for an organisation (delete policy)
  rpc DisableApp(DisableAppRequest) returns (DisableAppResponse) {
    option (google.api.http) = {
      delete: "/api/org/{orgId}/apps/{appId}"
    };
  }

  // ========== App Access Requests (invite_required apps) ==========

  // Request access to an invite_required app for an organisation
  rpc RequestAppAccess(RequestAppAccessRequest) returns (RequestAppAccessResponse) {
    option (google.api.http) = {
      post: "/api/org/{orgId}/apps/{appId}/request-access"
      body: "*"
    };
  }

  // List app access requests (admin: all pending, org: own requests)
  rpc ListAppAccessRequests(ListAppAccessRequestsRequest) returns (ListAppAccessRequestsResponse) {
    option (google.api.http) = {
      get: "/api/apps/access-requests"
    };
  }

  // Approve or deny an app access request (creates app_access_policies on approve)
  rpc ReviewAppAccessRequest(ReviewAppAccessRequestRequest) returns (ReviewAppAccessRequestResponse) {
    option (google.api.http) = {
      put: "/api/apps/access-requests/{requestId}"
      body: "*"
    };
  }

  // ========== Per-User App Access (within org) ==========

  // Invite a specific user to access an app within their org
  rpc InviteUserToApp(InviteUserToAppRequest) returns (InviteUserToAppResponse) {
    option (google.api.http) = {
      post: "/api/org/{orgId}/apps/{appId}/users"
      body: "*"
    };
  }

  // Revoke a specific user's direct app access
  rpc RevokeUserAppAccess(RevokeUserAppAccessRequest) returns (RevokeUserAppAccessResponse) {
    option (google.api.http) = {
      delete: "/api/org/{orgId}/apps/{appId}/users/{userId}"
    };
  }

  // List all users with access to an app (direct grants + group members with total count)
  rpc ListAppUsers(ListAppUsersRequest) returns (ListAppUsersResponse) {
    option (google.api.http) = {
      get: "/api/org/{orgId}/apps/{appId}/users"
    };
  }

  // ========== Organization Members ==========

  // Add a member to an organization
  rpc AddSubject(AddSubjectRequest) returns (AddSubjectResponse) {
  }

  // List all members of an organization
  rpc ListSubjects(ListSubjectsRequest) returns (ListSubjectsResponse) {
  }

  // Remove a member from an organization
  rpc RemoveSubject(RemoveSubjectRequest) returns (RemoveSubjectResponse) {
  }

  // Update member status in an organization
  rpc SetSubjectStatus(SetSubjectStatusRequest) returns (SetSubjectStatusResponse) {
  }

  // ========== Organisation Invitations ==========

  // Create and send an invitation to join an organisation
  rpc InviteSubject(InviteSubjectRequest) returns (InviteSubjectResponse) {
  }

  // List pending/accepted/revoked invitations for an organisation
  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse) {
  }

  // Revoke a pending invitation
  rpc RevokeInvitation(RevokeInvitationRequest) returns (RevokeInvitationResponse) {
  }

  // Resend an invitation email
  rpc ResendOrgInvitation(ResendOrgInvitationRequest) returns (ResendOrgInvitationResponse) {
    option (google.api.http) = {
      post: "/api/organizations/{orgId}/invitations/{invitationId}/resend"
      body: "*"
    };
  }

  // Accept an invitation (public, token-authenticated)
  rpc AcceptInvitation(AcceptInvitationRequest) returns (AcceptInvitationResponse) {
  }

  // NOTE: Plans and subscriptions have been moved to billing.proto
  // Billing runs as its own mesh role with a dedicated Turso database.
  // See Business/BILLING-SYSTEM.md for architecture details.

  // Get a user's billing subscriptions (proxied via BillingService)
  rpc GetUserSubscriptions(GetUserSubscriptionsRequest) returns (GetUserSubscriptionsResponse) {
    option (google.api.http) = {
      get: "/api/users/{userId}/subscriptions"
    };
  }

  // ========== Roles (Per-Org) ==========

  // List roles defined for an organization
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
    option (google.api.http) = {
      get: "/api/org/{orgId}/roles"
    };
  }

  // Create a custom role for an organization
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse) {
    option (google.api.http) = {
      post: "/api/org/{orgId}/roles"
      body: "*"
    };
  }

  // Update a role's name, description, or permissions
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse) {
    option (google.api.http) = {
      put: "/api/org/{orgId}/roles/{roleId}"
      body: "*"
    };
  }

  // Delete a custom role
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse) {
    option (google.api.http) = {
      delete: "/api/org/{orgId}/roles/{roleId}"
    };
  }

  // ========== Preferences ==========

  // Get user or org preferences
  rpc GetPreferences(GetPreferencesRequest) returns (GetPreferencesResponse) {
    option (google.api.http) = {
      get: "/api/preferences"
    };
  }

  // Update user or org preferences
  rpc UpdatePreferences(UpdatePreferencesRequest) returns (UpdatePreferencesResponse) {
    option (google.api.http) = {
      put: "/api/preferences"
      body: "*"
    };
  }

  // ========== IP Allowlist (Per-Org) ==========

  // List IP allowlist entries for an organization
  rpc ListIPAllowlist(ListIPAllowlistRequest) returns (ListIPAllowlistResponse) {
    option (google.api.http) = {
      get: "/api/org/{orgId}/ip-allowlist"
    };
  }

  // Add an IP address or CIDR to the org allowlist
  rpc AddIPAllowlist(AddIPAllowlistRequest) returns (AddIPAllowlistResponse) {
    option (google.api.http) = {
      post: "/api/org/{orgId}/ip-allowlist"
      body: "*"
    };
  }

  // Remove an IP allowlist entry
  rpc RemoveIPAllowlist(RemoveIPAllowlistRequest) returns (RemoveIPAllowlistResponse) {
    option (google.api.http) = {
      delete: "/api/org/{orgId}/ip-allowlist/{entryId}"
    };
  }

  // ========== Events & Logging ==========

  // Submit log event for persistence (mesh-based)
  rpc LogEvent(LogEventRequest) returns (LogEventResponse) {
    option (google.api.http) = {
      post: "/api/logs"
      body: "*"
    };
  }

  // List paginated and filtered events
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse) {
    option (google.api.http) = {
      get: "/api/events"
    };
  }

  // Get all events for a specific user
  rpc GetUserEvents(GetUserEventsRequest) returns (GetUserEventsResponse) {
    option (google.api.http) = {
      get: "/api/users/{userId}/events"
    };
  }

  // ========== Directory Sync (Admin Consent + Provider Sync) ==========

  // Initiate admin consent flow — returns redirect URL for the provider's consent page
  rpc InitiateAdminConsent(InitiateAdminConsentRequest) returns (InitiateAdminConsentResponse) {
  }

  // Complete admin consent — exchange auth code/consent for tokens and store provider
  rpc CompleteAdminConsent(CompleteAdminConsentRequest) returns (CompleteAdminConsentResponse) {
  }

  // Disconnect a directory provider from an organisation
  rpc DisconnectProvider(DisconnectProviderRequest) returns (DisconnectProviderResponse) {
    option (google.api.http) = {
      delete: "/api/org/{orgId}/directory-sync/{provider}"
    };
  }

  // List connected directory providers for an organisation
  rpc ListDirectoryProviders(ListDirectoryProvidersRequest) returns (ListDirectoryProvidersResponse) {
    option (google.api.http) = {
      get: "/api/org/{orgId}/directory-sync/providers"
    };
  }

  // Trigger a directory sync for an organisation (manual or scheduled)
  rpc TriggerDirectorySync(TriggerDirectorySyncRequest) returns (TriggerDirectorySyncResponse) {
    option (google.api.http) = {
      post: "/api/org/{orgId}/directory-sync/trigger"
      body: "*"
    };
  }

  // Get directory sync status and history for an organisation
  rpc GetDirectorySyncStatus(GetDirectorySyncStatusRequest) returns (GetDirectorySyncStatusResponse) {
    option (google.api.http) = {
      get: "/api/org/{orgId}/directory-sync/status"
    };
  }

  // ========== Internal/Service RPCs (no HTTP exposure) ==========

  // Verify service health and database connectivity
  rpc CheckHealth(CheckHealthRequest) returns (CheckHealthResponse) {
  }

  // Ensure user identity exists from OAuth data (get or create)
  rpc EnsureSubject(EnsureSubjectRequest) returns (EnsureSubjectResponse) {
  }

  // Check organisation access policy (IP allowlist, allowed providers, allowed apps)
  // Called on every authenticated request with org context, and during auth flows
  // (CompleteOAuth, HandoffRedemption, Verify2FA) when org context is present.
  rpc CheckOrgAccessPolicy(CheckOrgAccessPolicyRequest) returns (CheckOrgAccessPolicyResponse) {
  }

  // ========== Member Role Assignments (RBAC) ==========

  // Assign a role to an organisation member. Idempotent: duplicate
  // (organisationId, userId, roleId) triples succeed with alreadyAssigned=true.
  // Used during tenant provisioning to grant the initial owner role, and from
  // the RBAC admin UI to add roles to existing members.
  rpc GrantRole(GrantRoleRequest) returns (GrantRoleResponse) {
  }

  // Remove a role assignment from an organisation member. Idempotent:
  // removing a non-existent assignment succeeds with notAssigned=true.
  rpc RemoveMemberRole(RemoveMemberRoleRequest) returns (RemoveMemberRoleResponse) {
  }

  // List all role assignments (roleId, grantedBy, grantedAt) for an
  // organisation member. Consumed by the UserPolicyBundle compiler in
  // Quorum to look up per-role permissions during signed-policy issuance.
  rpc ListSubjectRoles(ListSubjectRolesRequest) returns (ListSubjectRolesResponse) {
  }

  // Flatten an organisation member's assigned roles into a deduplicated
  // permission scope set. Used by Quorum's user_policy.Compile hot-swap.
  // When the user has no explicit roles, memberStatus drives the fallback:
  // "admin" -> ["*"], anything else -> ["authenticated"].
  rpc ResolveMemberScopes(ResolveMemberScopesRequest) returns (ResolveMemberScopesResponse) {
  }

  // ========== Organisation Settings (Generic Key/Value) ==========

  // Read organisation-scoped settings by key projection (empty keys = return all).
  // Carries tenant CIDR allowlists, api_key rotation policy, custom-scope linter
  // overrides, and any other per-org configuration that downstream domains need.
  rpc GetOrgSettings(GetOrgSettingsRequest) returns (GetOrgSettingsResponse) {
  }

  // Upsert organisation-scoped settings. Empty `value` deletes the row.
  // Companion writer to GetOrgSettings — used by the manage.quorum.ai admin UI
  // and by tenant_provisioning bootstrap.
  rpc PutOrgSettings(PutOrgSettingsRequest) returns (PutOrgSettingsResponse) {
  }

  // ========== Per-User Capability Overrides ==========

  // Grant or deny a single scope on one organisation member, layered on top of
  // their role union. A deny beats any grant (even wildcard) because
  // ResolveMemberScopes emits it as a negative marker. The general per-user
  // capability layer (the MCP connect gate, orbtr.mcp.connect, is a consumer).
  rpc SetMemberCapabilityOverride(SetMemberCapabilityOverrideRequest) returns (SetMemberCapabilityOverrideResponse) {
  }

  // List a member's per-user capability overrides.
  rpc ListMemberCapabilityOverrides(ListMemberCapabilityOverridesRequest) returns (ListMemberCapabilityOverridesResponse) {
  }

  // Remove a per-user capability override (idempotent).
  rpc ClearMemberCapabilityOverride(ClearMemberCapabilityOverrideRequest) returns (ClearMemberCapabilityOverrideResponse) {
  }

  // ========== Partition lifecycle ==========
  //
  // CreatePartition above mints one. These five carry the rest of its life, and
  // they are named for the partition rather than for what a product calls its
  // customers, so one declaration serves every product that provisions.
  //
  // A partition's derived state — its databases, schemas and feature rows — is
  // the serving product's, reached through its own implementation. What travels
  // here is the lifecycle fact, which is why the responses carry a state and not
  // a description of what was torn down.

  // Stop a partition serving without destroying it. Idempotent: suspending a
  // suspended partition is a no-op that reports the same state.
  rpc SuspendPartition(SuspendPartitionRequest) returns (SuspendPartitionResponse) {
  }

  // Tear a partition down. Idempotent, and separate from Suspend because the
  // two are different decisions: one is reversible and one is not.
  rpc DeletePartition(DeletePartitionRequest) returns (DeletePartitionResponse) {
  }

  // Page through the partitions the caller may see. The caller's authority
  // bounds the result; the request carries no selector for whose to list.
  rpc ListPartitions(ListPartitionsRequest) returns (ListPartitionsResponse) {
  }

  // Read one partition.
  rpc GetPartition(GetPartitionRequest) returns (GetPartitionResponse) {
  }

  // Report where a partition is in provisioning. Distinct from GetPartition
  // because a partition can exist while its provisioning is still running, and
  // a caller that cannot tell those apart retries a completed provision or
  // serves an incomplete one.
  rpc GetPartitionStatus(GetPartitionStatusRequest) returns (GetPartitionStatusResponse) {
  }

  // ========== Partition name ==========

  // Rename the caller's own partition. The partition renamed is the proved
  // caller's, never one the request chooses. The name is written on the
  // partition's record, where sign-up writes the name the partition is founded
  // with, and the rename is recorded on the partition's audit trail.
  rpc RenamePartition(RenamePartitionRequest) returns (RenamePartitionResponse) {
  }

  // ========== Partition membership ==========

  // Answer whether one subject holds a membership in one partition, and the
  // kind of subject that membership is for. The asker is an endpoint admitting
  // a mesh call whose principal asserts a partition other than the transport's,
  // and which holds no membership graph of its own to read.
  //
  // Mesh only, with no HTTP binding: the request names any subject and any
  // partition, so the answer is for a platform service deciding admission and
  // never for the subject asked about. Message types live in
  // resolve_membership.proto.
  //
  // The missing HTTP binding does not keep a caller out: rpchttp.RegisterAll
  // mounts POST /rpc/<fqn> for every handler in the registry it is given,
  // bound or not. What confines this operation is the scope its declaration
  // admits, so that declaration must admit only a service caller in the
  // control partition: a partition-scoped one would let a member of any
  // partition learn whether a subject belongs to another.
  //
  // rpchttp.Bridge.HandleRPC also serves every handler of its registry, at
  // POST /rpc/{handler}, so a host that never calls RegisterAll on the
  // registry holding this operation still relies on that scope alone.
  rpc ResolveMembership(ResolveMembershipRequest) returns (ResolveMembershipResponse) {
  }
}

// ========== Request/Response Messages ==========

// ---- Neutral identity entities (subject / partition / grant) ----
// The vocabulary identityhost serves. A membership is one subject placed in one
// partition; an invitation is pending or settled; a partition is a minted key with a
// display name; a role grant is one opaque role edge a subject holds. Partition and
// subject are the proved caller's, never a request field.
message Membership {
  string partitionId = 1 [(contracts.options.v1.caller) = CALLER_PARTITION];
  string subjectId   = 2;
  string status       = 3; // consumer-defined; opaque here
}

message Invitation {
  string invitationId = 1;
  string partitionId  = 2 [(contracts.options.v1.caller) = CALLER_PARTITION];
  string role          = 3; // opaque; the grant attribute the acceptance carries
  string status        = 4; // "pending" | "accepted" | "revoked" | "expired"
  int64  expiresAt    = 5; // unix seconds; 0 = unset
  int64  acceptedAt   = 6; // unix seconds; 0 = unset
}

message Partition {
  string partitionId = 1 [(contracts.options.v1.caller) = CALLER_PARTITION];
  string name         = 2; // display name echoed from the mint request
}

message RoleGrant {
  string roleId    = 1; // opaque
  string grantedBy = 2; // opaque subject id, or empty for a system grant
  string grantedAt = 3; // RFC3339, or empty
}

message ExternalGroup {
  string id = 1;
  string name = 2;
  string email = 3;
}

message SyncExternalGroupsRequest {
  string partitionId = 1 [(contracts.options.v1.caller) = CALLER_PARTITION];
  string provider = 2; // "google", "microsoft"
  repeated ExternalGroup groups = 3;
}

message SyncExternalGroupsResponse {
  bool success = 1;
  int32 groupsSynced = 2;
  int32 groupsRemoved = 3;
}

message CheckAppAccessRequest {
  string userId = 1 [(contracts.options.v1.caller) = CALLER_SUBJECT];
  string appId = 2;
  string partitionId = 3 [(contracts.options.v1.caller) = CALLER_PARTITION];
}

message CheckAppAccessResponse {
  bool allowed = 1;
  string reason = 2;
}

message ListOrgGroupsRequest {
  string partitionId = 1 [(contracts.options.v1.caller) = CALLER_PARTITION];
  int32 pageSize = 2;
  string pageToken = 3;
}

message ListUserGroupsRequest {
  string partitionId = 1 [(contracts.options.v1.caller) = CALLER_PARTITION];
  string userId = 2 [(contracts.options.v1.caller) = CALLER_SUBJECT];
}

message ListUserGroupsResponse {
  repeated string groupIds = 1;
}

message ListOrgGroupsResponse {
  repeated Group groups = 1;
  string nextPageToken = 2;
}

message UpdateAppAccessRequest {
  string partitionId = 1 [(contracts.options.v1.caller) = CALLER_PARTITION];
  string appId = 2;
  repeated string allowedGroupIds = 3;
  repeated string deniedGroupIds = 4;
}

message UpdateAppAccessResponse {
  bool success = 1;
  int32 rulesUpdated = 2;
}

message Group {
  string id = 1;
  string name = 2;
  string description = 3;
  string partitionId = 4 [(contracts.options.v1.caller) = CALLER_PARTITION];
  string source = 5; // "internal", "google", "microsoft"
  string externalId = 6;
  int64 createdAt = 7;
  int64 updatedAt = 8;
}

message AddSubjectRequest {
  string subjectId = 1;
  string status     = 2;
  // roleIds are stored roles of the caller's partition assigned to the subject
  // across the partition in the same write as the membership, granted by the
  // caller. Each must be a live role assignable at the partition that the
  // caller holds. Empty assigns none.
  repeated string roleIds = 3;
}


message AddSubjectResponse {}


message CheckHealthRequest {
  // Empty request for health check
}


message CheckHealthResponse {
  string status = 1;
  string service = 2;
  string version = 3;
}


message CreatePartitionRequest {
  string name = 1;
}


message CreatePartitionResponse {
  Partition partition = 1;
}


// PartitionState is where one partition is in its own life. It is closed
// because the states a caller branches on are the ones the lifecycle defines,
// and an open string lets each product mint its own spelling for the same
// state — which is how two products end up disagreeing about what "suspended"
// admits. It ranks nothing and names no kind of principal: it describes one
// object, and a partition in any state is the same partition.
//
// UNSPECIFIED is the zero value so an unset field reads as "not established"
// rather than as active. A caller that cannot tell those apart serves a
// partition nobody said was serving.
enum PartitionState {
  PARTITION_STATE_UNSPECIFIED = 0;
  PARTITION_STATE_ACTIVE = 1;
  PARTITION_STATE_SUSPENDED = 2;
  PARTITION_STATE_DELETED = 3;
}


message SuspendPartitionRequest {
  string partitionId = 1 [(contracts.options.v1.caller) = CALLER_PARTITION];
  string reason       = 2; // free text, recorded with the change; may be empty
}


message SuspendPartitionResponse {
  PartitionState state = 1;
}


message DeletePartitionRequest {
  string partitionId = 1 [(contracts.options.v1.caller) = CALLER_PARTITION];
}


message DeletePartitionResponse {
  PartitionState state = 1;
}


message ListPartitionsRequest {
  int32 limit  = 1; // 0 = the implementation's default page
  int32 offset = 2;
}


message ListPartitionsResponse {
  repeated Partition partitions = 1;
  int32              total      = 2; // -1 when the implementation cannot count
}


message GetPartitionRequest {
  string partitionId = 1 [(contracts.options.v1.caller) = CALLER_PARTITION];
}


message GetPartitionResponse {
  Partition      partition = 1;
  PartitionState state     = 2;
}


message GetPartitionStatusRequest {
  string partitionId = 1 [(contracts.options.v1.caller) = CALLER_PARTITION];
}


// GetPartitionStatusResponse answers "is this partition finished provisioning",
// which GetPartition cannot: a partition exists from the moment it is minted
// and its derived state arrives afterwards, so a caller reading only the record
// serves a partition whose databases are not there yet.
message GetPartitionStatusResponse {
  PartitionState state    = 1;
  bool           complete = 2; // every step the serving product owns has run
  string         phase    = 3; // the product's own name for where it is; may be empty
}


// RenamePartitionRequest carries the caller's partition's new name. partitionId
// is compare-only, as GetPartitionRequest's is: empty, or the caller's own
// partition, and a request naming any other is refused.
message RenamePartitionRequest {
  string partitionId = 1 [(contracts.options.v1.caller) = CALLER_PARTITION];
  string name        = 2; // surrounding space is trimmed; empty is refused
}


message RenamePartitionResponse {
  Partition partition = 1; // the caller's partition and the name it now carries
}


message CreateUserRequest {
  string name = 1;
  string email = 2;
}


