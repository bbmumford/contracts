  string syncType = 3;       // "full", "delta", "manual"
  int32 groupsSynced = 4;
  int32 usersSynced = 5;
  int32 changes = 6;
  string duration = 7;
  string status = 8;          // "success", "partial", "failed"
  string error = 9;
}


// ========== Organisation Invitations ==========

message InviteSubjectRequest {
  string invitee = 1;
  string role    = 2; // opaque grant attribute the acceptance carries
  // families, when set, narrows a new membership the acceptance grants to the named
  // capability families. On a membership the subject already holds it adds them to a
  // narrowed one and leaves one reaching every family as it is, so an acceptance never
  // narrows. Empty adds no narrowing.
  repeated string families = 3;
  // roleIds are stored roles of the inviter's partition the acceptance assigns
  // to the invitee across the partition, granted by the inviter. Each is checked
  // against the inviter's standing when the invitation is issued and again when
  // it is accepted. Empty assigns none.
  repeated string roleIds = 4;
}

