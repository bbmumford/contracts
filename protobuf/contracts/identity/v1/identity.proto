// ========== Directory Sync Messages ==========

message InitiateAdminConsentRequest {
  string org_id = 1;
  string provider = 2;           // "microsoft", "google", "github"
  string return_url = 3;         // URL to redirect back to after consent
  string callback_base_url = 4;  // Base URL where consent callbacks are mounted (e.g. "https://app.orbtr.io")
}

message InitiateAdminConsentResponse {
  string redirect_url = 1;   // URL to redirect admin browser to
  string state = 2;          // Signed CSRF state token
  string error = 3;
}

message CompleteAdminConsentRequest {
  string org_id = 1;
  string provider = 2;
  string code = 3;                // Authorization code (Google/GitHub)
  string admin_consent = 4;       // "True" for Microsoft admin consent
  string tenant_id = 5;           // Microsoft: returned tenant ID
  string state = 6;               // CSRF state for validation
  string callback_base_url = 7;   // Base URL for token exchange redirect_uri
}

message CompleteAdminConsentResponse {
  bool success = 1;
  string provider_id = 2;    // Stored provider record ID
  string error = 3;
}

message DisconnectProviderRequest {
  string org_id = 1;
  string provider = 2;
}

message DisconnectProviderResponse {
  bool success = 1;
  string error = 2;
}

message ListDirectoryProvidersRequest {
  string org_id = 1;
}

message ListDirectoryProvidersResponse {
  repeated DirectoryProvider providers = 1;
}

message DirectoryProvider {
  string provider_id = 1;
  string provider = 2;        // "microsoft", "google", "github"
  string tenant_id = 3;       // Microsoft tenant ID
  string domain = 4;          // Google workspace domain
  string status = 5;          // "pending_consent", "active", "token_expired", "error", "disabled"
  bool admin_consent = 6;
  int64 last_sync_at = 7;
  int32 synced_groups = 8;
  int32 synced_users = 9;
  string last_error = 10;
}

message TriggerDirectorySyncRequest {
  string org_id = 1;
  string provider = 2;        // Empty = sync all connected providers
  bool full_sync = 3;         // true = full resync, false = delta if supported
}

message TriggerDirectorySyncResponse {
  bool success = 1;
  int32 groups_synced = 2;
  int32 users_synced = 3;
  int32 users_added = 4;
  int32 users_updated = 5;
  string duration = 6;
  string error = 7;
}

message GetDirectorySyncStatusRequest {
  string org_id = 1;
}

message GetDirectorySyncStatusResponse {
  bool sync_in_progress = 1;
  string current_provider = 2;
  int64 last_sync_at = 3;
  int32 total_synced_groups = 4;
  int32 total_synced_users = 5;
  repeated SyncHistoryEntry history = 6;
}

message SyncHistoryEntry {
  int64 timestamp = 1;
  string provider = 2;
  string sync_type = 3;       // "full", "delta", "manual"
  int32 groups_synced = 4;
  int32 users_synced = 5;
  int32 changes = 6;
  string duration = 7;
  string status = 8;          // "success", "partial", "failed"
  string error = 9;
}


