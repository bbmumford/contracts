message AppAccessRequest {
  string requestID = 1;
  string orgID = 2;        // Set for org-scoped requests (empty for user-only)
  string appID = 3;
  string requestedBy = 4;  // user_id of requester
  string status = 5;       // "pending", "approved", "denied"
  string reviewedBy = 6;
  string reviewNote = 7;
  int64 createdAt = 8;
  int64 reviewedAt = 9;
  GlobalService service = 10;  // Expanded service details
  string userID = 11;      // Set for user-scoped requests (empty for org-only)
}

message RequestAppAccessRequest {
  string orgID = 1;         // For org-scoped request (can be empty for user-only apps)
  string appID = 2;
  string requestedBy = 3;   // user_id
  string userID = 4;        // For user-scoped request (set when requesting personal access)
}

message RequestAppAccessResponse {
  bool success = 1;
  AppAccessRequest data = 2;
  string error = 3;
}

message ListAppAccessRequestsRequest {
  string status = 1;   // Optional filter: "pending", "approved", "denied"
  string orgID = 2;    // Optional filter: specific org's requests
  int32 pageSize = 3;
  string pageToken = 4;
  string userID = 5;   // Optional filter: specific user's requests
}

message ListAppAccessRequestsResponse {
  repeated AppAccessRequest data = 1;
  string nextPageToken = 2;
  int32 total = 3;
}

message ReviewAppAccessRequestRequest {
  string requestID = 1;
  bool approved = 2;       // true = approve, false = deny
  string reviewedBy = 3;   // admin user_id
  string reviewNote = 4;
  string orgID = 5;        // org context for per-org DB routing
}

message ReviewAppAccessRequestResponse {
  bool success = 1;
  AppAccessRequest data = 2;
  string error = 3;
}

