// ========== Org Access Policy Messages ==========

// CheckOrgAccessPolicy validates IP, provider, and app access against org policies.
// The identity service queries the per-org Turso database for:
//   1. IP allowlist — if entries exist and client_ip doesn't match any CIDR → deny
//   2. Allowed providers — if org has restrictions and provider not in list → deny
//   3. Allowed apps — if org has restrictions and app not in list → deny
// All three checks are optional: empty fields are skipped.
message CheckOrgAccessPolicyRequest {
  string orgID = 1;       // Organisation to check policies for (required)
  string clientIP = 2;    // Client IP address to check against IP allowlist
  string provider = 3;    // Auth provider (google, github, email, etc.) to check
  string appID = 4;       // Application ID to check against allowed apps
  string userID = 5;      // Authenticated user ID (for RBAC scope resolution)
  string memberStatus = 6; // Member status in org ("admin", "member") for fallback scopes
}

message CheckOrgAccessPolicyResponse {
  bool allowed = 1;         // true if all checks pass (or no restrictions configured)
  string deniedReason = 2;  // "ip_not_allowed", "provider_not_allowed", "app_not_allowed", "invite_required"
  string deniedDetail = 3;  // Human-readable explanation for logging/display
  repeated string scopes = 4; // Resolved RBAC scopes for the user in this org
}

