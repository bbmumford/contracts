// ========== Member Role Assignments ==========

message AssignMemberRoleRequest {
  string organisation_id = 1;
  string user_id         = 2;
  string role_id         = 3;
  string granted_by      = 4; // user_id of grantor; empty for system grants (tenant provisioner)
}

message AssignMemberRoleResponse {
  bool   success          = 1;
  bool   already_assigned = 2; // true when (org,user,role) already existed — still success
  string error            = 3;
}

message RemoveMemberRoleRequest {
  string organisation_id = 1;
  string user_id         = 2;
  string role_id         = 3;
}

message RemoveMemberRoleResponse {
  bool   success      = 1;
  bool   not_assigned = 2; // true when row didn't exist — still success (idempotent)
  string error        = 3;
}

message MemberRoleEntry {
  string role_id    = 1;
  string granted_by = 2;
  string granted_at = 3; // RFC3339 timestamp
}

message GetMemberRolesRequest {
  string organisation_id = 1;
  string user_id         = 2;
}

message GetMemberRolesResponse {
  bool                     success = 1;
  repeated MemberRoleEntry roles   = 2;
  string                   error   = 3;
}

message ResolveMemberScopesRequest {
  string organisation_id = 1;
  string user_id         = 2;
  // "admin" | "member" | "" — drives fallback when user has no explicit roles.
  string member_status   = 3;
}

message ResolveMemberScopesResponse {
  bool            success = 1;
  // Deduplicated union of role-attached permissions. Always includes
  // "authenticated" when at least one explicit role resolves; admin
  // fallback (no explicit roles + member_status="admin") yields ["*"].
  repeated string scopes  = 2;
  string          error   = 3;
}

// ========== Organisation Settings ==========

message OrgSetting {
  string key        = 1; // namespaced key (e.g. "quorum.tenant.cidr_allowlist")
  string value      = 2; // JSON-encoded; caller domain interprets the shape
  string updated_at = 3; // RFC3339 timestamp of last write
  string updated_by = 4; // user_id who performed the last write
}

message GetOrgSettingsRequest {
  string          organisation_id = 1;
  repeated string keys            = 2; // optional projection; empty = all settings
}

message GetOrgSettingsResponse {
  bool                success  = 1;
  repeated OrgSetting settings = 2;
  string              error    = 3;
}

message PutOrgSettingsRequest {
  string              organisation_id = 1;
  repeated OrgSetting settings        = 2; // upsert by key; empty value deletes
  string              updated_by      = 3;
}

message PutOrgSettingsResponse {
  bool   success = 1;
  int32  written = 2; // number of rows upserted (or deleted)
  string error   = 3;
}

