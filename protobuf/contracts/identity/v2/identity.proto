syntax = "proto3";

package contracts.identity.v2;

// The neutral identity wire contract identityhost serves as orbtr.identity.*. It
// speaks the sealed identity's own vocabulary — subject, partition, grant — and
// names no org, user, tenant, customer or owner. It backs the identity operations
// identityhost composes over census; the org/user-named v1 identity contract keeps
// serving the retiring service until its remaining operations reach neutral hosts.
//
// v2 lives beside v1 in the source tree; this module carries the version in the
// proto package and source directory, not the Go import path, so v2 takes its own
// go_package leaf — otherwise it overwrites v1's generated file and lands its types
// in v1's Go package.
option go_package = "github.com/bbmumford/contracts/identity/protobufv2;protobufv2";

// IdentityService is the surface identityhost serves. Authority is the proved
// caller's, never a request field: a partition-scoped operation acts within the
// partition sealed into the caller's identity, and a subject-scoped operation acts
// as the caller's sealed subject. A request names WHAT to act on, never whose
// authority to act under; a request-supplied subject is compare-only.
//
// CreatePartition is the one operation that reads neither an existing partition nor
// acts within one: it takes the caller's sealed SUBJECT and mints a partition with
// NO parent, granting that subject its founding membership. The minted partition is
// flat — not nested under the caller's partition or any other — because a partition
// is a key with no level.
service IdentityService {
  // ---- Membership (partition-scoped: partition from the proved caller) ----

  // Grant the membership edge placing a subject in the caller's partition.
  rpc AddSubject(AddSubjectRequest) returns (AddSubjectResponse);
  // The subjects holding a membership edge into the caller's partition.
  rpc ListSubjects(ListSubjectsRequest) returns (ListSubjectsResponse);
  // Revoke the membership edge placing a subject in the caller's partition.
  rpc RemoveSubject(RemoveSubjectRequest) returns (RemoveSubjectResponse);
  // Re-grant a subject's membership edge with a new status attribute.
  rpc SetSubjectStatus(SetSubjectStatusRequest) returns (SetSubjectStatusResponse);

  // The partitions the CALLING subject belongs to. Subject-scoped: the subject is
  // the proved caller; subject_id is compare-only, and an omitted value means the
  // caller asks about itself. One operation, one response envelope.
  rpc ListSubjectPartitions(ListSubjectPartitionsRequest) returns (ListSubjectPartitionsResponse);

  // ---- Invitations (partition-scoped) ----

  // Record a pending invitation whose acceptance grants the membership edge.
  rpc InviteSubject(InviteSubjectRequest) returns (InviteSubjectResponse);
  // The invitations recorded for the caller's partition, optionally by status.
  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse);
  // Cancel a pending invitation by id.
  rpc RevokeInvitation(RevokeInvitationRequest) returns (RevokeInvitationResponse);
  // Consume a token and grant the invitation's edge to the calling subject.
  // Subject-scoped: the subject is the proved caller.
  rpc AcceptInvitation(AcceptInvitationRequest) returns (AcceptInvitationResponse);

  // ---- Provisioning ----

  // Return the subject for a proved external identity, creating one on first sight.
  rpc EnsureSubject(EnsureSubjectRequest) returns (EnsureSubjectResponse);
  // Mint a fresh, parentless partition and grant the calling subject its first
  // membership. Subject-scoped: the founding subject is the proved caller.
  rpc CreatePartition(CreatePartitionRequest) returns (CreatePartitionResponse);

  // ---- Roles (partition-scoped) — a role is an opaque edge, not a named entity ----

  // Grant the role edge recording a subject holds a role, in the caller's partition.
  // role_id is opaque. The subject recording the grant is the proved caller, not a
  // request field.
  rpc GrantRole(GrantRoleRequest) returns (GrantRoleResponse);
  // The roles a subject holds, for a subject that is a member of the caller's
  // partition. A subject outside the caller's partition reads as holding no roles
  // (indistinguishable from not-found), not as refused.
  rpc ListSubjectRoles(ListSubjectRolesRequest) returns (ListSubjectRolesResponse);

  // ---- Liveness (no subject, no partition) ----
  rpc CheckHealth(CheckHealthRequest) returns (CheckHealthResponse);
}

// ---- Entities ----

// Membership is one subject placed in one partition, with the status the edge
// carries. It is the census membership edge on the wire.
message Membership {
  string partition_id = 1;
  string subject_id   = 2;
  string status       = 3; // consumer-defined; opaque here
}

// Invitation is a pending or settled invitation to a partition. The invitee's
// address is encrypted at rest and this host holds no key, so it is not carried.
message Invitation {
  string invitation_id = 1;
  string partition_id  = 2;
  string role          = 3; // opaque; the grant attribute the acceptance carries
  string status        = 4; // "pending" | "accepted" | "revoked" | "expired"
  int64  expires_at    = 5; // unix seconds; 0 = unset
  int64  accepted_at   = 6; // unix seconds; 0 = unset
}

// Partition is a minted partition. Descriptive config beyond a display name is a
// separate operation's concern — the mint returns the id and the neutral model
// carries no partition metadata here.
message Partition {
  string partition_id = 1;
  string name         = 2; // display name echoed from the mint request
}

// RoleGrant is one role edge a subject holds. granted_by reports the stored
// grantor — provenance the response carries, never an inbound request field.
message RoleGrant {
  string role_id    = 1; // opaque
  string granted_by = 2; // opaque subject id, or empty for a system grant
  string granted_at = 3; // RFC3339, or empty
}

// ---- Requests / Responses ----
// No request carries a partition_id: the partition is the proved caller's.

message AddSubjectRequest  { string subject_id = 1; string status = 2; }
message AddSubjectResponse { bool success = 1; }

message ListSubjectsRequest  {}
message ListSubjectsResponse { repeated Membership members = 1; }

message RemoveSubjectRequest  { string subject_id = 1; }
message RemoveSubjectResponse { bool success = 1; }

message SetSubjectStatusRequest  { string subject_id = 1; string status = 2; }
message SetSubjectStatusResponse { bool success = 1; }

// subject_id is compare-only against the proved caller; omitted = self.
message ListSubjectPartitionsRequest  { string subject_id = 1; }
message ListSubjectPartitionsResponse { repeated Membership memberships = 1; }

message InviteSubjectRequest  { string invitee = 1; string role = 2; }
message InviteSubjectResponse { bool success = 1; string invitation_id = 2; }

message ListInvitationsRequest  { string status = 1; }
message ListInvitationsResponse { repeated Invitation invitations = 1; int32 total = 2; }

message RevokeInvitationRequest  { string invitation_id = 1; }
message RevokeInvitationResponse { bool success = 1; }

message AcceptInvitationRequest  { string token = 1; }
message AcceptInvitationResponse { bool success = 1; string partition_id = 2; string subject_id = 3; }

message EnsureSubjectRequest {
  string email               = 1;
  string name                = 2;
  string provider            = 3; // external identity provider name
  string provider_subject_id = 4; // that provider's id for this subject
}
message EnsureSubjectResponse { string subject_id = 1; bool exists = 2; }

message CreatePartitionRequest  { string name = 1; }
message CreatePartitionResponse { bool success = 1; Partition partition = 2; }

// No granting-subject field: the actor recording the grant is the proved caller,
// taken from the sealed identity, never the request — a request-supplied grantor
// is a forgeable audit attribution.
message GrantRoleRequest  { string subject_id = 1; string role_id = 2; }
message GrantRoleResponse { bool success = 1; }

message ListSubjectRolesRequest  { string subject_id = 1; }
message ListSubjectRolesResponse { repeated RoleGrant roles = 1; }

message CheckHealthRequest  {}
message CheckHealthResponse { string status = 1; string service = 2; }
