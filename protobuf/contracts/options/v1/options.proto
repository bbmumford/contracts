syntax = "proto3";

package contracts.options.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/bbmumford/contracts/options;options";

// RateLimitPreset defines pre-configured rate limiting settings
// These map to core_ratelimit.CommonConfigs in the Go implementation
enum RateLimitPreset {
  RATE_LIMIT_UNSPECIFIED = 0;
  RATE_LIMIT_LOGIN = 1;
  RATE_LIMIT_RECOVERY = 2;
  RATE_LIMIT_HANDOFF = 3;
  RATE_LIMIT_OAUTH = 4;
  RATE_LIMIT_API_KEY = 5;
  RATE_LIMIT_GENERAL = 6;
  RATE_LIMIT_STRICT = 7;
}

// Method-level options for RPC definitions.
//
// Extension number 50105 was a method-level isolation level carried as metadata
// on every RPC. It is not reused: an extension number is allocated against
// google.protobuf.MethodOptions globally, so a new option taking 50105 would be
// read by anything still holding a descriptor that carries the old one.
extend google.protobuf.MethodOptions {
  // Rate limiting preset for this endpoint
  RateLimitPreset rateLimit = 50104;
}

// Service-level options
extend google.protobuf.ServiceOptions {
  // If true, this service is internal-only (VL1 mesh transport)
  bool internal = 50102;

  // Namespace qualifier for this service.
  // "platform" = HSTLES core domains, "app" = ORBTR/tenant domains.
  string namespace = 50106;
}

// CallerIdentity names the part of the proved caller a session-tier bridge
// writes into a field. library endpoint.NewAuthoritativeInjector reads it from
// each field of an arriving request message and overwrites that field with the
// caller's own partition, subject, session or client address, clearing it when
// the request proves no caller; a field without it keeps the value the request
// sent. The value, not the field's name, decides: a target field may carry a
// caller's name (a remote session's sessionId, an overlay's userId) and keep its
// value, and a caller field may take any name.
enum CallerIdentity {
  // Not stamped: the field carries what the request sent.
  CALLER_IDENTITY_UNSPECIFIED = 0;
  // The caller's partition.
  CALLER_PARTITION = 1;
  // The caller's subject.
  CALLER_SUBJECT = 2;
  // The caller's session.
  CALLER_SESSION = 3;
  // The caller's client address, by the edge's trusted-proxy rule.
  CALLER_ADDRESS = 4;
}

// Field-level options
extend google.protobuf.FieldOptions {
  // The part of the proved caller a session-tier bridge stamps into this
  // field. Only a singular string field is stamped; library
  // domain/hostcontract callerfield_test.go refuses the option on any other,
  // and refuses a field named for a caller's identity that carries neither this
  // option nor a reviewed entry stating why the platform leaves its value.
  CallerIdentity caller = 50107;
}
