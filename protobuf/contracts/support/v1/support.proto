syntax = "proto3";

package contracts.support.v1;

import "google/api/annotations.proto";
import "contracts/options/v1/options.proto";

option go_package = "github.com/bbmumford/contracts/support/protobuf;protobuf";

// SupportService provides multi-tenant ticket management, knowledge base,
// and admin operations over gRPC and HTTP.
// Runs as a dedicated mesh role with its own Turso database.
service SupportService {

  // ========== Tickets (tenant-scoped) ==========

  // Create a new support ticket
  rpc CreateTicket(CreateTicketRequest) returns (CreateTicketResponse) {
    option (google.api.http) = {
      post: "/api/support/tickets"
      body: "*"
    };
    option (contracts.options.v1.tenant_scope) = TENANT_SCOPE_TENANT;
    option (contracts.options.v1.rate_limit) = RATE_LIMIT_GENERAL;
  }

  // Get a ticket by ID (tenant-scoped)
  rpc GetTicket(GetTicketRequest) returns (GetTicketResponse) {
    option (google.api.http) = {
      get: "/api/support/tickets/{ticket_id}"
    };
    option (contracts.options.v1.tenant_scope) = TENANT_SCOPE_TENANT;
    option (contracts.options.v1.rate_limit) = RATE_LIMIT_GENERAL;
  }

  // List tickets for a user/email/org in a tenant
  rpc ListTickets(ListTicketsRequest) returns (ListTicketsResponse) {
    option (google.api.http) = {
      get: "/api/support/tickets"
    };
    option (contracts.options.v1.tenant_scope) = TENANT_SCOPE_TENANT;
    option (contracts.options.v1.rate_limit) = RATE_LIMIT_GENERAL;
  }

  // Update a ticket's status (tenant-scoped)
  rpc UpdateTicketStatus(UpdateTicketStatusRequest) returns (UpdateTicketStatusResponse) {
    option (google.api.http) = {
      put: "/api/support/tickets/{ticket_id}/status"
      body: "*"
    };
    option (contracts.options.v1.tenant_scope) = TENANT_SCOPE_TENANT;
  }

  // Update a ticket's priority (tenant-scoped)
  rpc UpdateTicketPriority(UpdateTicketPriorityRequest) returns (UpdateTicketPriorityResponse) {
    option (contracts.options.v1.tenant_scope) = TENANT_SCOPE_TENANT;
  }

  // Close a ticket (tenant-scoped)
  rpc CloseTicket(CloseTicketRequest) returns (CloseTicketResponse) {
    option (google.api.http) = {
      post: "/api/support/tickets/{ticket_id}/close"
      body: "*"
    };
    option (contracts.options.v1.tenant_scope) = TENANT_SCOPE_TENANT;
  }

  // ========== Confirmation (tenant-scoped) ==========

  // Generate an HMAC-signed confirmation token for ticket creation
  rpc GenerateConfirmationToken(GenerateConfirmationTokenRequest) returns (GenerateConfirmationTokenResponse) {
    option (google.api.http) = {
      post: "/api/support/confirm/generate"
      body: "*"
    };
    option (contracts.options.v1.tenant_scope) = TENANT_SCOPE_TENANT;
    option (contracts.options.v1.rate_limit) = RATE_LIMIT_STRICT;
  }

  // Validate a confirmation token and create the ticket
  rpc ValidateConfirmationToken(ValidateConfirmationTokenRequest) returns (ValidateConfirmationTokenResponse) {
    option (google.api.http) = {
      post: "/api/support/confirm/validate"
      body: "*"
    };
    option (contracts.options.v1.tenant_scope) = TENANT_SCOPE_TENANT;
    option (contracts.options.v1.rate_limit) = RATE_LIMIT_STRICT;
  }

  // ========== Messages (tenant-scoped) ==========

  // Add a message to a ticket
  rpc AddMessage(AddMessageRequest) returns (AddMessageResponse) {
    option (google.api.http) = {
      post: "/api/support/tickets/{ticket_id}/messages"
      body: "*"
    };
    option (contracts.options.v1.tenant_scope) = TENANT_SCOPE_TENANT;
  }

  // List messages for a ticket
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse) {
    option (google.api.http) = {
      get: "/api/support/tickets/{ticket_id}/messages"
    };
    option (contracts.options.v1.tenant_scope) = TENANT_SCOPE_TENANT;
    option (contracts.options.v1.rate_limit) = RATE_LIMIT_GENERAL;
  }

  // Get messages since a timestamp
  rpc GetMessagesSince(GetMessagesSinceRequest) returns (GetMessagesSinceResponse) {
    option (contracts.options.v1.tenant_scope) = TENANT_SCOPE_TENANT;
    option (contracts.options.v1.rate_limit) = RATE_LIMIT_GENERAL;
  }

  // ========== Events (tenant-scoped) ==========

  // List events for a ticket
  rpc ListTicketEvents(ListTicketEventsRequest) returns (ListTicketEventsResponse) {
    option (google.api.http) = {
      get: "/api/support/tickets/{ticket_id}/events"
    };
    option (contracts.options.v1.tenant_scope) = TENANT_SCOPE_TENANT;
    option (contracts.options.v1.rate_limit) = RATE_LIMIT_GENERAL;
  }

  // ========== Attachments (tenant-scoped) ==========

  // Record attachment metadata
  rpc AddAttachmentMeta(AddAttachmentMetaRequest) returns (AddAttachmentMetaResponse) {
    option (contracts.options.v1.tenant_scope) = TENANT_SCOPE_TENANT;
  }

  // List attachments for a ticket
  rpc ListAttachments(ListAttachmentsRequest) returns (ListAttachmentsResponse) {
    option (google.api.http) = {
      get: "/api/support/tickets/{ticket_id}/attachments"
    };
    option (contracts.options.v1.tenant_scope) = TENANT_SCOPE_TENANT;
    option (contracts.options.v1.rate_limit) = RATE_LIMIT_GENERAL;
  }

  // ========== Knowledge Base (tenant-scoped, public read) ==========

  // List KB categories
  rpc ListKBCategories(ListKBCategoriesRequest) returns (ListKBCategoriesResponse) {
    option (google.api.http) = {
      get: "/api/support/kb/categories"
    };
    option (contracts.options.v1.tenant_scope) = TENANT_SCOPE_TENANT;
    option (contracts.options.v1.rate_limit) = RATE_LIMIT_GENERAL;
  }

  // Get a KB category by slug
  rpc GetKBCategory(GetKBCategoryRequest) returns (GetKBCategoryResponse) {
    option (google.api.http) = {
      get: "/api/support/kb/categories/{slug}"
    };
    option (contracts.options.v1.tenant_scope) = TENANT_SCOPE_TENANT;
    option (contracts.options.v1.rate_limit) = RATE_LIMIT_GENERAL;
  }

  // List articles in a category
  rpc ListKBArticles(ListKBArticlesRequest) returns (ListKBArticlesResponse) {
    option (google.api.http) = {
      get: "/api/support/kb/categories/{category_slug}/articles"
    };
    option (contracts.options.v1.tenant_scope) = TENANT_SCOPE_TENANT;
    option (contracts.options.v1.rate_limit) = RATE_LIMIT_GENERAL;
  }

  // Get a KB article by slug
  rpc GetKBArticle(GetKBArticleRequest) returns (GetKBArticleResponse) {
    option (google.api.http) = {
      get: "/api/support/kb/categories/{category_slug}/articles/{article_slug}"
    };
    option (contracts.options.v1.tenant_scope) = TENANT_SCOPE_TENANT;
    option (contracts.options.v1.rate_limit) = RATE_LIMIT_GENERAL;
  }

  // Full-text search KB articles
  rpc SearchKBArticles(SearchKBArticlesRequest) returns (SearchKBArticlesResponse) {
    option (google.api.http) = {
      get: "/api/support/kb/search"
    };
    option (contracts.options.v1.tenant_scope) = TENANT_SCOPE_TENANT;
    option (contracts.options.v1.rate_limit) = RATE_LIMIT_GENERAL;
  }

  // ========== Admin (NOT tenant-scoped — control plane / service level) ==========

  // List tickets across all tenants (admin)
  rpc ListAllTickets(ListAllTicketsRequest) returns (ListAllTicketsResponse) {
    option (contracts.options.v1.tenant_scope) = TENANT_SCOPE_ORG;
  }

  // Get ticket with messages and events (admin)
  rpc GetTicketAdmin(GetTicketAdminRequest) returns (GetTicketAdminResponse) {
    option (contracts.options.v1.tenant_scope) = TENANT_SCOPE_PLATFORM;
  }

  // Add an internal note to a ticket (admin)
  rpc AddInternalNote(AddInternalNoteRequest) returns (AddInternalNoteResponse) {
    option (contracts.options.v1.tenant_scope) = TENANT_SCOPE_PLATFORM;
  }

  // Mark first response time for a ticket (admin)
  rpc SetFirstResponse(SetFirstResponseRequest) returns (SetFirstResponseResponse) {
    option (contracts.options.v1.tenant_scope) = TENANT_SCOPE_PLATFORM;
  }

  // List SLA-breached tickets (admin)
  rpc ListBreachedTickets(ListBreachedTicketsRequest) returns (ListBreachedTicketsResponse) {
    option (contracts.options.v1.tenant_scope) = TENANT_SCOPE_PLATFORM;
  }

  // Update ticket fields (admin, cross-tenant)
  rpc UpdateTicketAdmin(UpdateTicketAdminRequest) returns (UpdateTicketAdminResponse) {
    option (contracts.options.v1.tenant_scope) = TENANT_SCOPE_PLATFORM;
  }

  // Set Discord thread IDs for a ticket (admin)
  rpc SetDiscordThread(SetDiscordThreadRequest) returns (SetDiscordThreadResponse) {
    option (contracts.options.v1.tenant_scope) = TENANT_SCOPE_PLATFORM;
  }

  // Find ticket by Discord thread channel ID (admin)
  rpc GetTicketByDiscordChannel(GetTicketByDiscordChannelRequest) returns (GetTicketByDiscordChannelResponse) {
    option (contracts.options.v1.tenant_scope) = TENANT_SCOPE_PLATFORM;
  }

  // ========== Health ==========

  // Verify support service health
  rpc CheckHealth(CheckHealthRequest) returns (CheckHealthResponse) {
    option (contracts.options.v1.tenant_scope) = TENANT_SCOPE_NONE;
  }
}

// =============================================================================
// Shared model types
// =============================================================================

message Ticket {
  string id                = 1;
  string number            = 2;
  string tenant_id         = 3;
  string user_id           = 4;
  string email             = 5;
  string subject           = 6;
  string category          = 7;
  string priority          = 8;
  string status            = 9;
  string form_data         = 10; // JSON blob
  string discord_channel_id = 11;
  string discord_message_id = 12;
  string confirmed_at      = 13;
  string organisation_id   = 14;
  string app_id            = 15;
  string source            = 16;
  string user_agent        = 17;
  string ip_address        = 18;
  string created_at        = 19;
  string updated_at        = 20;
  string first_response_at = 21;
  string resolved_at       = 22;
  string closed_at         = 23;
}

message TicketMessage {
  string id                = 1;
  string ticket_id         = 2;
  string author_type       = 3;
  string author_id         = 4;
  string author_name       = 5;
  string author_email      = 6;
  string content           = 7;
  string content_html      = 8;
  string discord_message_id = 9;
  bool   synced_to_discord = 10;
  bool   is_internal       = 11;
  string created_at        = 12;
  string updated_at        = 13;
}

message TicketEvent {
  string id         = 1;
  string ticket_id  = 2;
  string event_type = 3;
  string actor_type = 4;
  string actor_id   = 5;
  string old_value  = 6;
  string new_value  = 7;
  string metadata   = 8;
  string created_at = 9;
}

message Attachment {
  string id           = 1;
  string ticket_id    = 2;
  string message_id   = 3;
  string filename     = 4;
  string content_type = 5;
  int64  size_bytes   = 6;
  string storage_key  = 7;
  string storage_url  = 8;
  string uploaded_by  = 9;
  string created_at   = 10;
}

message KBCategory {
  string id            = 1;
  string tenant_id     = 2;
  string name          = 3;
  string slug          = 4;
  string description   = 5;
  string parent_id     = 6;
  int32  sort_order    = 7;
  int32  article_count = 8;
  string created_at    = 9;
  string updated_at    = 10;
}

message KBArticle {
  string id            = 1;
  string title         = 2;
  string slug          = 3;
  string content       = 4;
  string content_html  = 5;
  string category_id   = 6;
  string category_name = 7;
  string category_slug = 8;
  string author_id     = 9;
  string author_name   = 10;
  string status        = 11;
  int32  view_count    = 12;
  int32  helpful_count = 13;
  string created_at    = 14;
  string updated_at    = 15;
  string metadata      = 16;
}

// =============================================================================
// Request / Response types
// =============================================================================

// ----- Tickets -----

message CreateTicketRequest {
  string tenant_id       = 1;
  string email           = 2;
  string subject         = 3;
  string category        = 4;
  string priority        = 5;
  string form_data       = 6; // JSON string
  string user_id         = 7;
  string organisation_id = 8;
  string source          = 9;
  string user_agent      = 10;
  string ip_address      = 11;
}
message CreateTicketResponse { Ticket ticket = 1; }

message GetTicketRequest {
  string tenant_id = 1;
  string ticket_id = 2;
}
message GetTicketResponse { Ticket ticket = 1; }

message ListTicketsRequest {
  string tenant_id       = 1;
  string user_id         = 2;
  string email           = 3;
  string organisation_id = 4;
  string status_filter   = 5;
}
message ListTicketsResponse { repeated Ticket tickets = 1; }

message UpdateTicketStatusRequest {
  string tenant_id = 1;
  string ticket_id = 2;
  string status    = 3;
}
message UpdateTicketStatusResponse { bool success = 1; }

message UpdateTicketPriorityRequest {
  string tenant_id = 1;
  string ticket_id = 2;
  string priority  = 3;
}
message UpdateTicketPriorityResponse { bool success = 1; }

message CloseTicketRequest {
  string tenant_id = 1;
  string ticket_id = 2;
}
message CloseTicketResponse { bool success = 1; }

// ----- Confirmation -----

message GenerateConfirmationTokenRequest {
  string tenant_id       = 1;
  string email           = 2;
  string subject         = 3;
  string category        = 4;
  string priority        = 5;
  string form_data       = 6;
  string source          = 7;
  string user_agent      = 8;
  string ip_address      = 9;
  string user_id         = 10;
  string organisation_id = 11;
  int32  ttl_seconds     = 12;
}
message GenerateConfirmationTokenResponse { string token = 1; }

message ValidateConfirmationTokenRequest {
  string tenant_id = 1;
  string token     = 2;
  string user_id   = 3;
}
message ValidateConfirmationTokenResponse { Ticket ticket = 1; }

// ----- Messages -----

message AddMessageRequest {
  string tenant_id    = 1;
  string ticket_id    = 2;
  string author_type  = 3;
  string author_id    = 4;
  string author_name  = 5;
  string author_email = 6;
  string content      = 7;
  string content_html = 8;
  bool   is_internal  = 9;
}
message AddMessageResponse { TicketMessage message = 1; }

message ListMessagesRequest {
  string tenant_id        = 1;
  string ticket_id        = 2;
  bool   include_internal = 3;
}
message ListMessagesResponse { repeated TicketMessage messages = 1; }

message GetMessagesSinceRequest {
  string tenant_id        = 1;
  string ticket_id        = 2;
  string since            = 3; // RFC3339 timestamp
  bool   include_internal = 4;
}
message GetMessagesSinceResponse { repeated TicketMessage messages = 1; }

// ----- Events -----

message ListTicketEventsRequest {
  string tenant_id = 1;
  string ticket_id = 2;
}
message ListTicketEventsResponse { repeated TicketEvent events = 1; }

// ----- Attachments -----

message AddAttachmentMetaRequest {
  string tenant_id    = 1;
  string ticket_id    = 2;
  string message_id   = 3;
  string filename     = 4;
  string content_type = 5;
  int64  size_bytes   = 6;
  string storage_key  = 7;
  string storage_url  = 8;
  string uploaded_by  = 9;
}
message AddAttachmentMetaResponse { Attachment attachment = 1; }

message ListAttachmentsRequest {
  string tenant_id = 1;
  string ticket_id = 2;
}
message ListAttachmentsResponse { repeated Attachment attachments = 1; }

// ----- Knowledge Base -----

message ListKBCategoriesRequest { string tenant_id = 1; }
message ListKBCategoriesResponse { repeated KBCategory categories = 1; }

message GetKBCategoryRequest {
  string tenant_id = 1;
  string slug      = 2;
}
message GetKBCategoryResponse { KBCategory category = 1; }

message ListKBArticlesRequest {
  string tenant_id     = 1;
  string category_slug = 2;
}
message ListKBArticlesResponse { repeated KBArticle articles = 1; }

message GetKBArticleRequest {
  string tenant_id     = 1;
  string category_slug = 2;
  string article_slug  = 3;
}
message GetKBArticleResponse { KBArticle article = 1; }

message SearchKBArticlesRequest {
  string tenant_id = 1;
  string query     = 2;
}
message SearchKBArticlesResponse { repeated KBArticle articles = 1; }

// ----- Admin (NOT tenant-scoped) -----

message ListAllTicketsRequest {
  string status_filter   = 1;
  string category_filter = 2;
  int32  limit           = 3;
  int32  offset          = 4;
}
message ListAllTicketsResponse {
  repeated Ticket tickets = 1;
  int32 total             = 2;
}

message GetTicketAdminRequest { string ticket_id = 1; }
message GetTicketAdminResponse {
  Ticket ticket                    = 1;
  repeated TicketMessage messages  = 2;
  repeated TicketEvent events      = 3;
}

message AddInternalNoteRequest {
  string ticket_id   = 1;
  string author_id   = 2;
  string author_name = 3;
  string content     = 4;
}
message AddInternalNoteResponse { TicketMessage message = 1; }

message SetFirstResponseRequest { string ticket_id = 1; }
message SetFirstResponseResponse { bool success = 1; }

message ListBreachedTicketsRequest {
  int32 first_response_threshold_minutes = 1;
  int32 resolution_threshold_minutes     = 2;
}
message ListBreachedTicketsResponse { repeated Ticket tickets = 1; }

message UpdateTicketAdminRequest {
  string ticket_id = 1;
  string status    = 2;
  string priority  = 3;
  string category  = 4;
}
message UpdateTicketAdminResponse { Ticket ticket = 1; }

message SetDiscordThreadRequest {
  string ticket_id          = 1;
  string discord_channel_id = 2;
  string discord_message_id = 3;
}
message SetDiscordThreadResponse { bool success = 1; }

message GetTicketByDiscordChannelRequest { string channel_id = 1; }
message GetTicketByDiscordChannelResponse { Ticket ticket = 1; }

// ----- Health -----

message CheckHealthRequest {}
message CheckHealthResponse {
  bool   healthy = 1;
  string message = 2;
}
